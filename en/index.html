with the educational practice of Denmark, a country renowned for its education. The study rests on the vision of the NPO Communities Nature Education Project: “a society where ‘spending childhood learning in the countryside’ is the norm.” As population concentrates in cities and society ages, rural landscapes of satoyama and satoumi, rich in nature and traditional culture, are in themselves the finest “schoolhouse” (educational resource), offering abundant experiences and learning. Creating learning environments that nurture “the ability to live freely and richly” with an eye to the next fifty years, through nature and contact with the local community, is also vital to the sustainability of rural towns.", "This report compares the educational environments of Miyama Town (Nantan City, Kyoto Prefecture) and Gribskov Municipality (Helsinge), Denmark. With the greatest respect and gratitude for the passion and resilience of teachers who continue to support children under extremely busy conditions, the main aim of the study is to help create “places of learning that give new value to local resources,” where schools, families and communities raise children together rather than in isolation."]}, {"h": "1.2 Structure of the report and analytical approach", "p": ["To understand the educational environments of Miyama Town and Gribskov Municipality from multiple angles and to sketch a future for sustainable community-based education, this report uses a “mixed-methods approach” (integrating quantitative and qualitative data) and a “two-stage comparative approach.”"]}, {"h": "Analytical approach: integrating quantitative and qualitative data", "sub": 1, "p": ["Rather than simply comparing numbers, we combined quantitative and qualitative data to capture the circumstances of schools and the voices of those involved in three dimensions. For the quantitative data we used questionnaire results from teachers (Japan 15, Denmark 23) and parents (Japan 26, Denmark 27) in Miyama and Gribskov, identifying trends in each area regarding teachers’ working conditions, external support, and educational goals and attitudes.", "For the qualitative data we analysed interview records with teachers and students at the local school, Nordstjerneskolen (the “North Star” school), together with the free-text answers in the questionnaires. This allowed us to grasp what numbers alone cannot capture: teachers’ thoughts, how children experience daily school life, and the expectations and concerns parents hold about the learning environment.", "To understand the background to attitudes and challenges in more detail, we also looked at respondents’ attributes, such as teaching experience and role, and at students’ developmental stages. Specifically, drawing on grade bands such as lower and upper elementary and junior high school in Japan, and Grades 0–3 and Grades 4–9 in Denmark, we examined how perceptions of the learning environment and of challenges differ by position and developmental stage. By combining the quantitative and qualitative data with this attribute-based analysis, we organised the structure of issues that lies behind individual figures and opinions."]}, {"h": "Two-stage structure of the analysis", "sub": 1, "p": ["To respect the context and cultural background of each country, the analysis proceeds in two stages.", "1. Country analyses (Chapters 3 and 4): First, for Japan (Miyama) and Denmark (Gribskov) separately, we examine in detail the facts, the realities of teachers’ work, and the achievements and challenges revealed by the quantitative and qualitative data.", "2. Integrated comparison (Chapter 5): Building on these, we compare the two countries side by side, looking at “differences arising from the education systems,” “strengths common to both,” and “barriers shared by both.”"]}]}, {"id": "ch2", "no": "Chapter 2", "title": "Overview of the Study", "lead": "Combining questionnaires with on-site interviews.", "secs": [{"h": null, "p": ["In both Japan (Miyama) and Denmark (Gribskov) we carried out quantitative questionnaires for teachers and parents (five-point scales plus multiple-choice and free-text questions). We also conducted qualitative interviews and a site visit with teachers and students at a local Danish school, Nordstjerneskolen. An overview of the data and respondents is shown in the table below."]}, {"h": "Table 1 Survey targets and respondents", "block": "table1"}]}, {"id": "ch3", "no": "Chapter 3", "title": "The Learning Environment in Japan (Miyama)", "lead": "Reading today’s schools through the answers of teachers and parents.", "secs": [{"h": "3.1 Questionnaire results", "block": "mi-summary"}, {"h": "3.2 Teachers’ working conditions and structural risk", "p": ["The questionnaire figures reveal a lack of mental and time capacity in schools. Only 0% of teachers (0 of 15) said they have room to put new educational ideas into practice, and 53.3% answered negatively, showing how little spare capacity remains. Furthermore, 86.7% said they are “too busy with daily duties and covering the curriculum to take on anything new.” These figures show that teachers are absorbed in routine tasks, making it a burden to fulfil the essential work of “education” itself.", "Yet even in these extreme conditions, education in Miyama is sustained by the “resilience” (recovery and creative ingenuity) of its schools, and its quality remains high. The figures for securing dialogue in lessons (80.0%) and for using local resources such as the integrated study programme “Miyama Studies” (86.7%) show teachers’ commitment to maintaining quality despite their workload.", "In practice, Miyama runs its own community-rooted education: fifth and sixth graders explore “what we want to keep in Miyama ten years from now”; “Miyama Studies” brings local resources such as the town’s rich natural environment, traditional culture, history and rural landscape into the curriculum so that children learn in a self-directed, inquiry-based way; and the “Machigoto School Meeting” brought residents and parents together in one place. These efforts, which put children’s learning first in any circumstances and seek to stand together with the community, are a real source of hope for building sustainable schools."]}, {"h": "3.3 The perception gap between parents and teachers", "block": "gap-mi", "p": ["Teachers feel frustration and helplessness at being “too busy to give enough individual attention,” and parents want “to talk with teachers more and to have their child’s individuality and diverse needs seen.” Yet parents’ reluctance to “become a burden on teachers” acts as a psychological barrier and is one reason open two-way dialogue is held back.", "While parents hope school will nurture “self-esteem” and “the courage to take on challenges,” they see how busy teachers are, and a “considerate reticence (silence)” arises: “with work-style reform being called for, we should refrain from consultations or requests that add to the burden.” This dilemma can weaken the partnership between school and family. Amid these opinions, a certain number of parents also chose “I don’t feel there are any particular issues,” showing differing perceptions of school education."]}, {"h": "3.4 Structural differences by career and developmental stage", "p": ["Because the questionnaires also collected respondents’ attributes, we analysed how perceptions of schools and their challenges differ by teachers’ careers (age and years of experience) and by children’s developmental stage (grade).", "Because the number of respondents in each age or grade group within the Japanese sample (teachers N=15, parents N=26) is small, we avoid simple comparison or generalisation of figures and instead describe “qualitative tendencies” in attitudes and concerns according to teachers’ careers and parents’ positions.", "Across all age groups, no teacher (0.0%) agreed that they have “time and mental room” (Q12); every age group faces heavy workload, but the focus of their interests and concerns clearly differs by career stage. Young teachers in their twenties (3; under 5 to under 15 years of experience) put each child’s inner struggles and relationships first, with goals such as “listening to and accepting their feelings so the child can choose a path that is easier to live” and “developing ways of relating and communicating with others.” At the same time, caught between inexperience and an enormous daily workload, they express real confusion and mental strain: “I’m so busy every day with what’s in front of me that I have no room to think.” Mid-career teachers in their thirties and forties (7; under 5 to over 15 years) emphasise future independence and the agency to live through an unpredictable society, with goals such as “raising people who can live in any era or society” and “continuing to learn and enjoy life as adults.” As for challenges, besides the intense time pressure of being central to school administration and class management, they point to barriers rooted in practice and local structure, such as “a lack of staff or contact points to coordinate with the community and outside companies” and “the inconveniences of a remote area, such as little public transport and skewed relationships.” Veteran teachers with over 15 years of experience (50s and older, 5) hold comprehensive visions such as “raising children who surpass us adults” and “every child we teach living their own happy life.”", "Regarding the challenges facing schools, they value highly the results of community collaboration such as “Miyama Studies” and the “Machigoto School Meeting,” while pointing to a structural issue: “the mindset of schools, the community and staff has not kept up with major changes in society.” Rather than relying on one-off initiatives or the passion of particular teachers, they strongly call for “an established cycle of better education” that keeps working even when teachers transfer, and for organisational support.", "Parents also point to gaps related to children’s developmental stages and the link between elementary and junior high school. In the lower elementary grades, parents are highly satisfied with the relaxed, community-rooted environment. But as children move into the upper grades and junior high, with a shift towards club activities and academics and towards discipline-centred guidance, parents express concern and confusion about a “wall between elementary and junior high” that breaks off the self-directed learning and warm relationships nurtured in elementary school."]}]}, {"id": "ch4", "no": "Chapter 4", "title": "The Learning Environment in Denmark (Gribskov)", "lead": "Local practice and the voices of those involved, side by side.", "secs": [{"h": "Reading this as a field record", "note": 1, "p": ["Descriptions of systems and school management in this chapter include what we were told during on-site interviews. Please distinguish school-specific practice and respondents’ views from national systems. Statements about systems are based on explanations given during the interviews."]}, {"h": "4.1 Questionnaire and interview results", "block": "dk-summary"}, {"h": "4.1-3 Analysis of teacher interviews", "sub": 1, "p": ["From the interviews and site visit at Nordstjerneskolen, we could see that the room for manoeuvre and the dialogue in lessons reported by Danish teachers rest on institutionalised assessment methods and a flexible working environment. This section summarises the main findings from qualitative interviews with teachers (2) and students (4) at the school. For the full interviews, see Appendix C.", "In Danish compulsory education, the law sets formal exams only in Grades 8 and 9, and there are no report cards up to Grade 7. Day-to-day learning is assessed in many ways, including short reports, presentations and class discussions. While teachers share the attainment goals set by the government and Ministry of Education, specific assessment criteria and teaching methods are left to each teacher. At Nordstjerneskolen, subject teachers set common assignments while each teacher decides on individual assessment. (Appendix C, question 1)", "Teachers’ statutory working time is 40 hours per week, with a maximum of 26 lessons (of 45 minutes) per week. The number of lessons is flexibly adjusted according to role and duties; teachers with positions such as subject coordinator or school-trip organiser teach fewer lessons. All teachers have shared preparation time, but because different subjects need different amounts of preparation, the burden is felt unevenly. (Appendix C, question 2) To support students from different language and cultural backgrounds, younger students (up to Grade 6) at Nordstjerneskolen can take lessons with a specialist teacher of Danish as a second language. In the upper grades, however, there is no unified support system, and supporting students who speak no Danish, such as refugees from Ukraine, depends on individual teachers. For school avoidance, which has been increasing in recent years, there is no school-wide policy or system; teachers meet parents individually and make “individual agreements,” such as attending only certain subjects or lessons. (Appendix C, question 3)", "Danish education’s strengths lie in “learning how to learn” and in developing critical thinking, creativity and self-determination. On the other hand, students have become more individualistic in recent years, and because forcing students into activities they refuse can risk being illegal, guiding them has become harder. And while individual freedom and self-determination are valued, the risk of “isolation” and individualistic behaviour within the school as a social group is a structural issue. Co-teaching (two teachers per class), introduced to deal with differences in students’ levels, also brings the practical challenge of coordinating teachers with different teaching approaches. (Appendix C, question 4)"]}, {"h": "4.1-4 Analysis of student interviews", "sub": 1, "p": ["Beyond the perspectives of teachers and systems, capturing “children’s real experience of school life” as the people most directly involved in learning is essential to building a sustainable learning environment. In the parent questionnaire (4.1-2), many Danish parents expressed strong trust in the school’s approach and its “respect for the individual,” but how children actually exercise agency, respect each other’s individuality, and what challenges and needs they have in their learning environment must be understood from students’ own words. Below we look at Danish education from the students’ point of view. For the full interviews, see Appendix C.", "Students’ opinions and requests are respected in most situations, from school rules and events to daily lessons. When students speak up about what they want or suggest improvements, teachers usually try to adjust and make it happen. This environment supports students’ strong agency and sense of ownership of school life.", "When students disagree during group work or discussions, they usually resolve it among themselves through dialogue without teachers stepping in (they can ask the teacher to change groups if needed). Nor are they expected to conform or to be friends with people they don’t get along with; a culture of respecting each other’s individuality through free self-expression, such as clothing and hair colour, is well established.", "Students feel most motivated and comfortable being themselves in lessons of subjects they like or with teachers they trust. Some students also find it easier to express their opinions and ideas freely in small groups than in large ones.", "At the same time, students raised concrete issues and needs in daily school life. From Grade 7 onwards, assignments are mostly group projects, leaving less quiet time to work alone, and one student said “I also want time to concentrate on my own.” Students also feel that the current school life and lesson style mean they only interact with a limited group, so the class tends to be divided, and they asked for activities that help the whole class get to know each other."]}, {"h": "4.2 Teachers’ working conditions and institutional room for manoeuvre", "p": ["In the Danish teacher questionnaire, 30.4% said they have time and mental room to put new ideas into practice (43.5% disagreed). In contrast to Japan, where 0% agreed, a certain proportion of teachers feel they have some room.", "One factor behind this is well-functioning support. The Danish system provides plenty of courses and materials to help teachers adapt to new policies and educational ideas, and teachers actively keep their learning up to date. Because organisational support for teachers is in place, it creates not only time but also mental room.", "Even with this institutional backing, however, the sense of being busy has not disappeared. Alongside process-based assessment without report cards until Grade 7, co-teaching, and working conditions such as a 40-hour week and a cap of 26 lessons, there is strong backing for students through practical career education such as “Juniormesterlære,” run with local companies and vocational schools. Yet this individualised work also weighs on teachers."]}, {"h": "4.3 Students’ and parents’ perspectives and acceptance of the system", "block": "gap-dk", "p": ["In Denmark, teachers and parents share a common foundation that values autonomy and dialogue. However, as family circumstances become more unequal and students more individualistic, a gap in expectations is emerging: teachers feel “a lack of cooperation from families and limits on what they can require,” while parents closely watch “the quality of the school’s support for academic progress and individual needs.”", "Students feel their opinions are reflected in the school’s culture and lessons, while expressing concrete, real needs for their learning environment: short breaks during 90-minute lessons, time to work and concentrate alone amid mostly group work, and activities to prevent division within the class.", "Parents show high trust in assessment that does not rely solely on test results and in the school’s respect for the individual. But some also call for better handling of growing differences in attainment as children move up, and for more individualised and transparent support for students with school avoidance or diverse backgrounds."]}, {"h": "4.4 Structural differences by career and developmental stage", "p": ["Looking at Danish teachers’ (N=23) answers by career and age, beneath the shared sense of busyness and commitment to dialogue there are clear differences in educational vision and concerns according to experience.", "Teachers in their twenties and thirties focus strongly on students “learning how to learn” and on building a safe classroom where students can ask questions and share opinions without fear of failure. Valuing interaction among students through pair work and project-based learning (PBL), they work hard on individual approaches and careful relationship-building despite the busyness of daily duties and covering the curriculum.", "Teachers in the middle group, mainly in their forties, aim to develop curious, confident and independent learners, balancing subject knowledge with independent thinking. In this group, some teachers manage to keep a certain amount of time and mental room through their own ingenuity despite the workload, while there is a stronger tendency to see gaps in educational approach and perception between the school and the community or parents as the main barrier.", "Veteran teachers in their fifties and older stand out for writing about longer-term, comprehensive human development, such as building “klassefællesskab” (class community), a traditional Danish educational ideal, and pursuing “Bildung.” They set out aims that look at the structure of society: combining basic skills with social inclusion in the lower grades, connecting to society and careers through practical work-experience programmes (Juniormesterlære), and developing social intelligence that respects nature and others in a consumer society. They also show strong organisational insight, pointing to the importance of team teaching (co-teaching) to reach all students equally.", "In this way, among Danish teachers the scope of education broadens and becomes more structured with career progression: from “building a foundation of self-directed learning and relationships in a safe space” among younger teachers to “class community, Bildung and structural links to society and careers” among mid-career and veteran teachers.", "Danish parents’ (N=27) attitudes shift with children’s developmental stage. In the lower grades (Grades 0–3), adjusting to school and a safe environment are the priority, and concerns stand out about classroom disruption linked to meeting diverse needs and about the number of substitute teachers. As children move into Grades 4–9, expectations shift towards “solid academic knowledge” and “critical thinking,” and the lack of “differentiated teaching by level” to meet differences in understanding is seen as the main issue. A defining feature in Denmark is that the role expected of school moves from “safety and stability in the early grades” to “guaranteeing solid academic attainment from the upper grades.”"]}]}, {"id": "ch5", "no": "Chapter 5", "title": "Integrated Comparison of Japan and Denmark", "lead": "Setting differences and common ground side by side, and moving to the next question.", "secs": [{"h": "5.1 Two contrasting structural gaps", "block": "table6"}, {"h": "[Teachers’ environment] The biggest structural gap: an absolute lack of room (Q12)", "sub": 1, "p": ["The clearest difference between the two countries in teachers’ environment concerned “time and mental room to take on new initiatives” (Q12). In Japan (Miyama), 0.0% of teachers (0 of 15) answered positively, compared with 30.4% (7 of 23) in Denmark. Negative answers were 53.3% (8) in Japan and 43.5% (10) in Denmark, showing that teachers in neither country necessarily feel they have enough room.", "The sense of being caught up in daily duties (Q15) was high in both: 86.7% in Japan and 82.6% in Denmark. This suggests that teachers’ busyness itself is a challenge common to both countries. In time and mental room for new initiatives, however, there was a clear difference between Japan and Denmark.", "In Denmark, systems that spread and adjust teachers’ workload, such as co-teaching and managed working hours, appear to allow about three in ten teachers to secure time and mental room for new initiatives. In Japan (Miyama), by contrast, not one of the 15 respondents said they have room, showing how hard it is to find the capacity to consider and carry out new educational practice on top of daily work.", "These results suggest that while teachers in both countries are busy, an important difference between the two learning environments lies in how much “space for new educational activities and improvement” they can secure."]}, {"h": "[Parents’ values] The biggest value gap: contrasting priorities (parent Q7)", "sub": 1, "p": ["Comparing parents’ answers on “the abilities they most want their children to gain” (Q7) shows clear differences between Japan (Miyama) and Denmark. In particular, the two countries show contrasting priorities for “high academic ability and knowledge” and “living authentically and self-esteem.”", "“High academic ability and knowledge” was chosen by 11.5% of parents in Japan (3 of 26), tied for last place with respect for rules (11.5%). In Denmark it was chosen by 59.3% (16 of 27), the highest share. Conversely, “living authentically and self-esteem” was the top choice in Japan at 42.3% (11 of 26), but only 22.2% (6 of 27) in Denmark.", "This suggests that parents in Japan (Miyama) place more importance on children gaining the ability to affirm themselves and live authentically than on acquiring knowledge or academic ability. Parents in Denmark give higher priority to “high academic ability and knowledge” and expect the school to ensure solid learning and knowledge.", "However, this difference should not be read simply as “Japan doesn’t value academics” and “Denmark does.” It needs to be interpreted in light of each educational environment and social background. The results suggest that Japanese parents strongly expect school to foster “living authentically and self-esteem,” while Danish parents, against a background of educational values that respect the individual and autonomy, expect school to ensure solid acquisition of academic knowledge.", "So rather than parents in the two countries seeing children’s growth in different directions, it is more accurate to say that, within each social and educational setting, they differ in the role they expect school to play and the educational content they want it to emphasise."]}, {"h": "5.2 Shared achievements and shared barriers", "block": "table7"}, {"h": "Shared achievements (dialogue and use of local resources)", "sub": 1, "p": ["Comparing the two learning environments shows shared strengths in “securing dialogue and active participation” and “using local resources.” Teachers who said they secure dialogue and active participation in daily lessons were 80.0% in Japan and 69.6% in Denmark, both high levels. Those who said they use local resources in teaching reached 86.7% in Japan and 73.9% in Denmark."]}, {"h": "Shared structural barriers (lack of time and diverging perceptions)", "sub": 1, "p": ["In both countries more than 80% of teachers say they are caught up in daily duties, but the factors behind this busyness differ in characteristic ways.", "In Japan (Miyama), “administrative and organisational load,” such as management tasks, covering the curriculum and coordinating with outside parties, tends to drive teachers’ busyness. In Denmark, the “growing complexity of educational work itself,” such as including students with diverse needs in mainstream school, dealing with various issues within classes and strengthening individualised support, seems to drive the burden. Given this difference, the key challenge in Japan is first to reduce teachers’ administrative and organisational burden so they can devote more time and energy to teaching itself. In Denmark, while teachers can already spend enough time on teaching, the challenge is how to build support for increasingly complex needs as the student population diversifies.", "Beyond teachers’ time, gaps in attitudes and expectations about education between schools and communities or parents also emerge as a challenge common to both countries. Rather than treating teachers’ burden simply as an internal school problem, it is important to build shared understanding of what roles school, family and community each play and how they support children’s growth."]}, {"h": "5.3 Comparing educational views: “respect for the individual” and “group cooperation”", "block": "kotoshudan", "p": ["Denmark’s “individual-respecting, process-focused” approach brings clear achievements and its own challenges. It nurtures critical thinking and students’ self-determination, and it allows flexible, individual responses for students with school avoidance or diverse backgrounds. On the other hand, it can lead to isolation within the group and a sense of burden on “the individual” in the upper grades, and careful attention to each student tends to depend on individual teachers’ discretion and personal workload.", "Japan’s model of “group cooperation and close attention” also has both light and shadow. High levels of cooperation and unity, and holistic growth through overcoming difficulties, are strengths that Danish educators also praised. But it has created a structure that relies too heavily on teachers’ self-sacrificing work, in which “the individual” is easily lost in the group, and serious overwork erodes teachers’ mental and time capacity."]}, {"h": "5.4 Use of local resources and external partnerships", "p": []}, {"h": "Common ground | Strong results in teaching through local resources (nature, culture, history)", "sub": 1, "p": ["In both Japan (Miyama) and Denmark, more than 70% of teachers (Japan 86.7%, Denmark 73.9%) say local resources such as unique culture, history and nature are effectively built into the curriculum and learning activities. In Miyama, community-rooted practices include “Miyama Studies,” the integrated study programme about the area’s nature and history; the fifth- and sixth-grade inquiry “what we want to keep in Miyama ten years from now”; after-school children’s classes; and hometown learning. In Denmark too, the local community itself is seen as a living place of learning beyond the school building, and active learning is promoted."]}, {"h": "Common ground | Projects and hands-on learning with communities, businesses and NPOs", "sub": 1, "p": ["In both countries, practical learning in partnership with outside actors such as residents, businesses and NPOs is active. In Miyama, 53.3% of teachers said they focus on “special classes and joint events with local residents or companies” and on “inquiry learning about local issues,” and feel they are effective. In Denmark, systems that connect learning to society are also at work, such as “Juniormesterlære,” practical career education with local companies and vocational schools, and special classes with outside experts."]}, {"h": "Difference | How open schools are and how residents take part", "sub": 1, "block": "openness", "p": ["In partnerships with communities and outside parties, there is a clear difference in the “structure of participation” by which residents and parents are involved in school management and education.", "In Japan (Miyama), the aim is an inclusive, whole-community model that raises children across the town, through the “Machigoto School Meeting,” where residents, parents, teachers and children gather in one place, and through links between the school management council (community school) and the “Miyama Town Development Committee.” A defining feature is an open structure in which diverse stakeholders, including residents without children at the school, deliberate as equals and take part in school management and local education.", "In Denmark, by contrast, parents’ institutional involvement and influence are designed to be very strong: half the members of the School Board are parents, and the chair is also a parent. On the other hand, residents without children at the school have limited opportunities or mechanisms to take part directly in school management; instead the school welcomes them and hears their views at an annual “open school.” So Miyama’s model opens the school inclusively to the whole community, while Denmark opens it partially to the community within a structure of rights and responsibilities centred on parents."]}, {"h": "5.5 Gaps in perception among stakeholders", "block": "table8", "p": ["In Japan (Miyama), gaps among stakeholders take on two particular forms: “transition gaps” linked to children’s developmental stages, and parents’ “considerate reticence.” At the transition from elementary to junior high, warm, friendly relationships with the community and parents built in elementary school tend to give way to manual-like, discipline-focused guidance in junior high. This leaves parents confused and worried that the relaxed learning and community links nurtured in elementary school are cut off. Parents also hope for their children’s self-esteem and courage to grow, yet seeing how extremely busy teachers are, they feel they must hold back from consultations or requests that would add to the burden, a dilemma of consideration and reticence.", "In Denmark, gaps arise from different causes: friction linked to the diversification of families’ economic and cultural backgrounds and to “individualisation.” With more families facing economic hardship or immigrant families who do not speak Danish, it is hard to get the same interest and cooperation from all families, and the school has to rely on its know-how and the care of individual teachers. Moreover, as students become more individualistic and forcing them into activities they refuse carries legal risk, forming individual agreements such as “attending only certain subjects” between teachers, students and parents involves considerable effort to align understandings and find compromises."]}]}, {"id": "ch6", "no": "Chapter 6", "title": "Outlook for Educational Practice and Community Collaboration", "lead": "From one person’s effort to systems of mutual support.", "secs": [{"h": "6.1 Engaging with children and parents amid heavy workloads", "p": ["In the Miyama teacher questionnaire, only 0.0% said they have “time and mental room” for new initiatives, while 86.7% reported being busy with daily duties and covering the curriculum, revealing schools under extreme administrative and organisational load. To keep engaging warmly with children and parents even in such conditions, teaching structures, assessment methods and ways of communicating need to be reviewed structurally.", "The first need is a shift to team-based teaching in which “no teacher carries everything alone.” As with co-teaching and role-based adjustment of teaching loads in Denmark, a willingness to share and divide tasks flexibly among teachers and external support staff is essential. Not leaving class concerns and individual issues to particular teachers, and strengthening everyday information-sharing and team responses, becomes the foundation for teachers’ mental room.", "Next, it is important to make effective use of small daily dialogues and “process assessment.” In Denmark there are no report cards until Grade 7, and growth is assessed from many angles through short reports, presentations and daily discussions. By building on reflection sheets, Loilonote (a digital learning tool), pair work and group learning already used in Miyama, and shifting the basis of assessment from large tests and assessment work to the accumulation of small daily learning and insights, schools can reduce workload while carefully watching each child’s growth.", "Finally, active communication is essential to ease parents’ “considerate reticence.” As the results show, many parents hesitate to consult or contact teachers out of concern for their workload: “I don’t want to burden busy teachers any more.” Continuing to communicate through school newsletters, digital contact tools and class newsletters is a key to deepening trust with parents and preventing psychological misunderstandings and the escalation of problems."]}, {"h": "6.2 Seeing the school as a “partner in raising children”", "p": ["In the parent questionnaire, “living authentically and self-esteem,” “having and expressing one’s own opinions” and “the courage to take on challenges without fear of failure” were the top abilities parents want their children to gain. To realise children’s healthy growth and these abilities, schools and families need to build a true partnership that goes beyond “service provider and consumer.”", "To do this, parents need to move away from being “consumers of education” who one-sidedly evaluate and make demands of the school as a “place that provides educational services,” and redefine themselves as “joint partners (co-producers)” who raise children together with schools and teachers. Volunteering small forms of support, such as watching over children on the way to and from school, helping at school events or joining community events, reduces teachers’ administrative and organisational burden and helps them regain “time to face each child.” It is also important to turn the “considerate reticence” of parents who, worried about teachers’ workload, keep their troubles and worries to themselves, into warm dialogue. Rather than holding back and giving up on consulting because “it’s a bother when they’re so busy,” parents are encouraged to make active use of contact notebooks and parent–teacher meetings, adding a word of thanks, to share their child’s situation at home and small concerns openly. Open, everyday information-sharing prevents misunderstandings between parents and teachers and lays the foundation for stronger trust.", "Supportive involvement at home and active dialogue with the school also play a big role in overcoming the “gap between elementary and junior high school.” Some parents, not only children, feel confused by the change in approach from “relaxed, community-rooted relationships” in elementary school to “discipline, club activities and academics” in junior high. It is effective for families to support children facing this change gently at home, while discussing and sharing openly with the school how the approaches of elementary and junior high can be connected, through forums such as the “Machigoto School Meeting.”"]}, {"h": "6.3 The role of the community in school education", "p": ["Miyama already has a rich foundation for learning that draws on the community itself, and excellent practice such as “Miyama Studies” and the fifth- and sixth-grade inquiry “what we want to keep in Miyama ten years from now.” For children to grow independently within the community and for the whole community to build sustainable schools, rather than concentrating excessive burden on schools, the community itself needs to actively take on the role of “a protagonist and collaborating partner in education.”", "In Miyama, the school management council, the town development committee and NPOs already form a pioneering base of external coordination between the community and schools. The next focus is to increase “organisational and operational flexibility” on the school side to accept outside proposals, so that this coordination becomes more effective. To let teachers respond to outside partnerships while busy with the curriculum and administration, it is important to reserve flexible “inquiry and community partnership slots” in the annual teaching plan in advance, and to advance “purpose-sharing delegation,” entrusting part of lessons to outside experts. By loosening the assumption that “everything must be completed and managed within the school” and enabling quick decisions and flexible acceptance, existing community partnerships can deepen into smoother, more sustainable systems.", "It is also highly effective to adopt the perspective of practical career education represented by Denmark’s “Juniormesterlære,” with the whole community providing living places of learning. Local businesses in Miyama, from its rich agriculture and traditional crafts such as thatched roofing to local enterprises and tourism, could create practical experiences and learning opportunities that warmly welcome elementary and junior high students. Through real experiences that bring children into direct contact with the work and lives of local adults, not just observation visits, children can discover their strengths and interests and build a foundation for future independence and careers.", "Furthermore, it is essential to centre on multi-generational forums such as the “Machigoto School Meeting” and to deepen and establish deliberation within the local education community. Regular, maturing forums where residents, parents, teachers and children gather to discuss the future of the community and of education as equals are needed. By establishing a sustainable cycle of raising children as a whole community, beyond temporary help with school events, learning in which school and community are truly united can be carried forward into the future."]}, {"h": "6.4 Limitations of the study and lasting Japan–Denmark educational ties", "p": ["This study is based on quantitative questionnaires and qualitative interviews conducted at a single point in time in limited areas and with limited samples in Japan (Miyama) and Denmark (Gribskov). There are therefore limits to generalising its findings directly to the education systems or cultures of the two countries. Results must be interpreted carefully in light of local context, social structure and sample size.", "However, the value of this study does not lie only in a one-off snapshot or a record of a visit. It lies in continuing to use two different educational models and values as a “mirror for dialogue,” reflecting each other so that each can look objectively at its own learning environment and challenges. Rather than ending with a one-time comparison, we hope for a lasting partnership in which both sides keep questioning how education should be and keep inspiring improvements in each other.", "To make this kind of sustainable educational exchange concrete, it is highly effective to make multi-layered exchange opportunities for both children and teachers a regular feature. For students, this could include direct exchanges, exchange programmes and cultural events on site (such as a JAPAN DAY), offering repeated experiences of other cultures and diverse values. For teachers, regular online exchanges of information and discussions of lesson practice can build a cross-border network of mutual learning.", "In this way, a cycle needs to take root in which both sides respect each other’s educational culture, continue the dialogue, and feed the practical knowledge and learning gained on each side back into their own local education. Educators and communities in both areas continuing to walk together as “partners who learn from each other” will be a powerful driving force for building sustainable schools and opening a rich future for children."]}]}, {"id": "ch7", "no": "Chapter 7", "title": "Conclusion", "lead": "Growing the school of the future together with the community.", "secs": [{"h": null, "p": ["Through quantitative questionnaires and qualitative interviews in Japan (Miyama) and Denmark (Gribskov), this study has compared and analysed from many angles the structural challenges facing schools in both areas and their efforts to improve children’s well-being. Japan’s model of “group cooperation and close attention” and Denmark’s model of “respect for the individual and focus on process” each have strengths rooted in their historical and cultural context, while facing different kinds of barriers in today’s schools.", "In Japanese schools, including Miyama, a high standard of education is maintained through inquiry learning that draws on the area’s rich nature and history, represented by “Miyama Studies,” and through teachers’ deep passion and persistent ingenuity (resilience). At the same time, the study revealed a structural risk: teachers have lost critical time and mental room and must rely on self-sacrificing work. In Denmark, a certain amount of room is maintained through institutional backing such as co-teaching, adjusted teaching loads and process-based assessment without report cards, but the growing complexity of responding to students’ individualisation and diversifying families has become a new burden.", "The greatest key to building sustainable schools is to move away from a structure that depends only on individual teachers’ abilities and passion, towards a sustainable system in which schools, families and communities function as true “joint partners.” Alongside team-based teaching and flexible curriculum management to reduce teachers’ administrative and organisational load, opportunities for open communication and dialogue that dissolve parents’ “considerate reticence” need to be expanded. Furthermore, by making use of existing external coordination such as the school management council, the town development committee and NPOs, while increasing schools’ flexibility to accept outside involvement, the whole community can deepen its role as a living place of learning.", "The foundation for children to value their own individuality and, working with others, to develop “the ability to live authentically” amid nature’s blessings and the warm involvement of the local community is already alive in Miyama. Using two different models of education, Japan’s and Denmark’s, as a “mirror for dialogue” for each other, and continuing to learn from each other’s wisdom and strengths, is the firm foundation for protecting teachers’ well-being and opening up the future of children and the sustainability of local communities."]}]}], "preface": ["What kind of education lets children grow up as themselves, surrounded by rich nature and warm-hearted local people? And how can an environment arise in which teachers, parents and local residents also learn alongside children and support one another?", "To explore these questions, guided by the vision of the NPO Communities Nature Education Project, “a society where ‘spending childhood learning in the countryside’ is the norm,” we carried out an educational study linking Miyama Town in Nantan City, Kyoto Prefecture, with Gribskov Municipality in Denmark.", "The study began from a simple curiosity: several years after an earlier study, how had Danish schools changed?", "As we prepared for our visit and interviews, another question arose between the two of us, the university students leading the trip.", "“Before learning about education in Denmark, what is the situation in the Japanese schools where we live?”", "Prompted by this question, as preparation before going to Denmark we conducted a questionnaire for Japanese teachers, first trying to see the reality of schools in Miyama through our own eyes.", "Then, as we compared the results of the questionnaire in Japan with our fieldwork in Denmark, not only the learning environment around children but also the relationships among teachers, schools and parents, and the feelings each of them holds, gradually came into view.", "To understand “the connections between schools, parents and the community” more deeply, after returning we also conducted an additional questionnaire for parents in both Japan and Denmark. This let us learn about the hopes shared by the people who support education in both countries, and the challenges each area faces.", "This report is not intended only to introduce examples from abroad or to compare survey results. We have put it together in the hope that it will serve as a “starting point for dialogue,” listening to the voices of teachers, parents and children themselves in each area of Japan and Denmark, and thinking about what schools and communities could become.", "Finally, our heartfelt thanks go to the teachers, parents and students of Miyama and of Gribskov, Denmark, who took time out of busy days to answer our questionnaires and interviews, and to everyone who supported this project."], "glossary": [{"t": "Aula", "d": "A communication platform used by Danish schools and childcare institutions for children, parents and staff to contact each other and share information about school life. It helps in understanding “information-sharing between school and home” in this report.", "src": "KOMBIT, “Aula”", "url": "https://kombit.dk/loesninger/aula", "date": "19 October 2026"}, {"t": "Juniormesterlære", "d": "An option for students in Grades 8 and 9 that combines learning at school with work placements or practical training at companies. For example, students spend one or two days a week at a company or vocational school and the rest at school. Each municipality sets up its own framework.", "src": "Danish Ministry of Children and Education, “Juniormesterlære”", "url": "https://uvm.dk/grundskole/folkeskolen/fag-og-indhold/udskoling/juniormesterlaere/", "date": "19 October 2026"}, {"t": "Co-teaching", "d": "A method in which two educators jointly plan, deliver and evaluate lessons and teach at the same time. It differs from simply adding a teacher to the classroom in its shared responsibility and use of both professionals’ expertise. The Japanese report also calls it “two homeroom teachers per class.”", "src": "Emu, Danish education portal, “Tilrettelæg, gennemfør og evaluér co-teaching”", "url": "https://emu.dk/grundskole/undervisningsmiljoe/co-teaching/tilrettelaeg-gennemfoer-og-evaluer-co-teaching?b=t5-t3834-t5119", "date": "19 October 2026"}, {"t": "Formative assessment", "d": "Assessment that checks understanding and progress during learning and uses that information for feedback and to adjust teaching, supporting the next stage of learning. What matters is not only the format, such as quizzes or presentations, but how the information is used to improve learning.", "src": "OECD (2025), “Using formative assessment and feedback”", "url": "https://www.oecd.org/en/publications/2025/04/unlocking-high-quality-teaching_808bd876/full-report/using-formative-assessment-and-feedback_189fb6dc.html", "date": "19 October 2026"}, {"t": "Well-being", "d": "In this report, used to describe the physical and mental state of children and teachers, their sense of safety, and how comfortable school life is. It was not measured as a whole by any single question.", "src": "Chapters 1, 2 and 5 and the questions in Appendix A (editorial reading aid)"}, {"t": "Mixed methods", "d": "In this report, an approach to analysis that combines questionnaire figures with interviews and free-text answers to read learning environments from many sides.", "src": "Chapters 1, 2 and 5 (editorial reading aid)"}, {"t": "Stakeholders", "d": "People in positions connected with school education. In this report, mainly teachers, parents, students and local residents.", "src": "Chapters 1, 2 and 5 (editorial reading aid)"}], "chapterFix": {"ch1": "* In this web edition, the number of Danish parents in the text has been corrected to 27 to match Appendix A.", "ch3": "* In this web edition, the figures in Table 3-1 (share caught up in daily duties, lack of outside contact points, gap in awareness) and the parents’ column have been corrected to match Appendix A.", "ch4": "* In this web edition, figures in 4.2, Table 4 and 4.4 (share disagreeing, “no particular issue,” gap in awareness, critical thinking and self-expression, number of parents) have been corrected to match Appendix A.", "ch5": "* In this web edition, figures in the text of 5.1 and 5.2 and in Tables 6 and 7 (Miyama’s Q15, Danish self-esteem, Danish Q3, etc.) have been corrected to match Appendix A."}, "voiceCount": 167, "qaCount": 15};
</script>
<script>(function(){
const D = window.SITE;
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (c,n)=> (c/n*100).toFixed(1);

/* ---------- chart builders ---------- */
function dumbbell(rows,{sort=true}={}){
  let r = rows.slice();
  if(sort) r.sort((a,b)=>(b.mi-b.dk)-(a.mi-a.dk));
  return `<div class="dumb" role="table">${r.map(x=>{
    const lo=Math.min(x.mi,x.dk), hi=Math.max(x.mi,x.dk), miR=x.mi>=x.dk;
    const lbl=(v,isMi)=>{const right=(isMi===miR);return `style="left:calc(${v}% ${right?'+ 12px':'- 12px'});${right?'':'transform:translateX(-100%)'}"`};
    return `<div class="drow ${x.dk>x.mi?'dkwin':''}" role="row">
      <div class="lab" role="cell">${x.q?`<span class="qn">${x.q}</span>`:''}${esc(x.label)}${x.rev?' <span class="fine">* lower is better</span>':''}</div>
      <div class="track" role="cell" aria-label="Miyama ${x.mi.toFixed(1)}%, Denmark ${x.dk.toFixed(1)}%">
        <span class="span" style="left:${lo}%;width:${hi-lo}%"></span>
        <span class="dot" style="left:${x.mi}%;background:var(--mi)"></span>
        <span class="dot" style="left:${x.dk}%;background:var(--dk)"></span>
        <span class="val" ${lbl(x.mi,true)}>${x.mi.toFixed(1)}</span>
        <span class="val" ${lbl(x.dk,false)}>${x.dk.toFixed(1)}</span>
      </div></div>`}).join('')}</div>
  <div class="axis"><div></div><div><span>0%</span><span>50%</span><span>100%</span></div></div>`;
}
function pbars(rows,{hot}={}){
  return `<div class="pbars">${rows.map(x=>`<div class="pb ${hot&&hot===x.label?'hot':''}">
    <div class="lab">${esc(x.label)}</div>
    <div class="row"><span class="who">Miyama</span><span class="b"><i style="width:${x.mi}%;background:var(--mi)"></i></span><span class="v">${x.mi.toFixed(1)}%${x.cmi!=null?`<small>${x.cmi}</small>`:''}</span></div>
    <div class="row"><span class="who">Denmark</span><span class="b"><i style="width:${x.dk}%;background:var(--dk)"></i></span><span class="v">${x.dk.toFixed(1)}%${x.cdk!=null?`<small>${x.cdk}</small>`:''}</span></div>
  </div>`).join('')}</div>`;
}
function seg(c,n,color){
  const p=c.map(v=>v/n*100);
  const t=['Agree','Neutral','Disagree'];
  return `<span class="seg" role="img" aria-label="${t.map((x,i)=>x+' '+p[i].toFixed(1)+'% ('+c[i]+')').join(', ')}">
    <i style="width:${p[0]}%;background:${color}" title="Agree: ${c[0]}">${p[0]>=12?p[0].toFixed(1):''}</i>
    <i class="neu" style="width:${p[1]}%" title="Neither agree nor disagree: ${c[1]}">${p[1]>=12?p[1].toFixed(1):''}</i>
    <i class="neg" style="width:${p[2]}%" title="Disagree: ${c[2]}">${p[2]>=12?p[2].toFixed(1):''}</i></span>`;
}
const cntl=c=>`<span class="cnt">Agree ${c[0]} · Neutral ${c[1]} · Disagree ${c[2]}</span>`;
function likert(set,keys){
  const T=D.likert[set], rows=keys?T.rows.filter(r=>keys.includes(r.q)):T.rows;
  return `<div class="legend"><span><i style="background:var(--mi)"></i><i style="background:var(--dk);margin-left:-4px"></i>Agree</span><span><i style="background:var(--neu)"></i>Neither agree nor disagree</span><span><i style="background:var(--neg)"></i>Disagree</span></div>
  <div class="lk">${rows.map(r=>`<div class="lkrow"><div class="lab">Q${r.q}. ${esc(r.text)}</div>
    <div class="lkbar"><span class="who">Miyama ${T.nMi}</span>${seg(r.mi,T.nMi,'var(--mi)')}${cntl(r.mi)}</div>
    <div class="lkbar"><span class="who">Denmark ${T.nDk}</span>${seg(r.dk,T.nDk,'var(--dk)')}${cntl(r.dk)}</div>
    ${r.note?`<div class="fine">${esc(r.note)}</div>`:''}</div>`).join('')}</div>`;
}
function multi(set){
  const T=D.multi[set];
  return pbars(T.rows.map(r=>({label:r.label,mi:+pct(r.mi,T.nMi),dk:+pct(r.dk,T.nDk),cmi:r.mi,cdk:r.dk})),{hot:T.hot});
}
function slope(){
  const R=D.multi.q7.rows.filter(r=>r.label!=='Other');
  const W=660,H=330,x1=200,x2=W-200,top=40,bot=H-24;
  const y=v=>bot-(v/70)*(bot-top);
  const place=(arr,k,n)=>{const pos=arr.map(r=>({r,y:y(r[k]/n*100)}));pos.sort((a,b)=>a.y-b.y);for(let i=1;i<pos.length;i++){if(pos[i].y-pos[i-1].y<22)pos[i].y=pos[i-1].y+22}return new Map(pos.map(p=>[p.r.label,p.y]))};
  const lm=place(R,'mi',26), ld=place(R,'dk',27);
  return `<svg class="slope" viewBox="0 0 ${W} ${H}" role="img" aria-label="Abilities parents most want children to gain (Miyama and Denmark)">
   <text x="${x1}" y="18" text-anchor="middle" font-size="14" fill="var(--ink)">Miyama (26)</text>
   <text x="${x2}" y="18" text-anchor="middle" font-size="14" fill="var(--ink)">Denmark (27)</text>
   <line x1="${x1}" y1="${top-8}" x2="${x1}" y2="${bot}" stroke="var(--line)" stroke-width="2"/>
   <line x1="${x2}" y1="${top-8}" x2="${x2}" y2="${bot}" stroke="var(--line)" stroke-width="2"/>
   ${R.map(r=>{const a=r.mi/26*100,b=r.dk/27*100,hot=r.short==='Academics';
     return `<line x1="${x1}" y1="${y(a)}" x2="${x2}" y2="${y(b)}" stroke="${hot?'var(--coral)':'var(--ink-2)'}" stroke-width="${hot?4:2}" stroke-opacity="${hot?1:.45}"/>

  out.innerHTML=html||`<p class="empty">No answers contain “${esc(vf.q)}”. Try another word, or set the area and group filters back to “All”.</p>`;
  $('#vcount').textContent=`Showing ${total}`;
  document.querySelectorAll('.seg-ctl[data-k]').forEach(c=>c.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(vf[c.dataset.k]===b.dataset.v))));
}

/* interview */
let ilang='en';
ROUTES.interview=()=>crumbs([{t:'Summary',h:'top'},{t:'Appendix C: Full interviews'}])+`<div class="wrap">
  <div class="page-head"><span class="eyebrow">Appendix C <span class="layer-tag" style="margin-left:8px">LAYER 3</span></span><h1>Full interviews</h1>
  <p>Records of interviews with two teachers and four students at Nordstjerneskolen in Gribskov, Denmark. The English and Japanese records provided by the researchers are reproduced as they are. The Japanese includes some additions not in the English, so the two are not a strict word-for-word translation. Explanations of systems reflect what we were told at the time and have not been independently checked against legislation.</p></div>
  <div class="filters"><span class="seg-ctl" id="ilang"><button data-v="en">English</button><button data-v="both">English + 日本語</button></span><span class="count">${D.qaCount} questions</span></div>
  <div id="iout"></div></div>`;
function renderInterview(){
  const out=$('#iout'); if(!out) return; let n=0;
  out.innerHTML=D.interview.map(g=>`<section class="vgroup"><h2><span class="chip ${g.who==='teacher'?'dk':'both'}">${g.who==='teacher'?'Teachers':'Students'}</span>${g.who==='teacher'?'Interview with teachers':'Interview with students'}</h2>
   ${g.topics.map(t=>`<div class="itopic" id="interview-${g.who[0]}${t.no}"><h3>${t.no}. ${esc(t.title)}</h3>${t.qs.map(q=>{n++;return `<div class="qa">
     <div class="q"><b class="dk">Q${n}</b><span>${esc(q.q_en)}</span></div><div class="a">${esc(q.a_en)}</div>
     ${ilang==='both'?`<div class="en" lang="ja"><span class="eq">${esc(q.q_ja)}</span><span>${esc(q.a_ja)}</span></div>`:''}
   </div>`}).join('')}</div>`).join('')}</section>`).join('');
  document.querySelectorAll('#ilang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===ilang)));
}

/* data */
let dset='teacher';
ROUTES.data=()=>crumbs([{t:'Summary',h:'top'},{t:'Appendix A: Survey data'}])+`<div class="wrap">
  <div class="page-head"><span class="eyebrow">Appendix A <span class="layer-tag" style="margin-left:8px">LAYER 3</span></span><h1>Survey data</h1>
  <p>Results of the teacher and parent questionnaires in Miyama and Denmark (Gribskov). For five-point scales, “agree / strongly agree” are grouped as Agree and “disagree / strongly disagree” as Disagree. The number of people is shown beside each bar.</p></div>
  <div class="filters"><span class="seg-ctl" id="dset"><button data-v="teacher">Teachers (Miyama 15, Denmark 23)</button><button data-v="parent">Parents (Miyama 26, Denmark 27)</button></span></div>
  <div id="dout"></div></div>`;
function renderData(){
  const out=$('#dout'); if(!out) return;
  if(dset==='teacher') out.innerHTML=`<div class="datagrid">
    <div class="full" id="data-a7">${chart('Tables A-7 / A-10: School management and learning environment (five-point scale)',likert('teacher'),'Source: Appendix A, Table A-7 (Miyama) and Table A-10 (Denmark).')}</div>
    <div id="data-a8">${chart('Tables A-8 / A-11: Initiatives you focus on or that are working (Q14, multiple choice)',LEG+multi('q14'),D.multi.q14.note)}</div>
    <div id="data-a9">${chart('Tables A-9 / A-12: The biggest barrier in your school (Q15, up to 2)',LEG+multi('q15'),D.multi.q15.note)}</div></div>`;
  else out.innerHTML=`<div class="datagrid">
    <div class="full" id="data-a1">${chart('Tables A-1 / A-4: Relationship with and views of the school (five-point scale)',likert('parent'),'Source: Appendix A, Table A-1 (Miyama) and Table A-4 (Denmark). For Q3, lower is better.')}</div>
    <div id="data-a2">${chart('Tables A-2 / A-5: The biggest issue in school education and relations with the school (Q6, up to 2)',LEG+multi('q6'),D.multi.q6.note)}</div>
    <div id="data-a3">${chart('Tables A-3 / A-6: Abilities you most want your child to gain (Q7, up to 2)',LEG+multi('q7'),D.multi.q7.note)}</div></div>`;
  document.querySelectorAll('#dset button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===dset)));
}

ROUTES.glossary=()=>crumbs([{t:'Summary',h:'top'},{t:'Appendix D: Glossary'}])+`<div class="wrap">
  <div class="page-head"><span class="eyebrow">Appendix D <span class="layer-tag" style="margin-left:8px">LAYER 3</span></span><h1>Glossary of key terms</h1><p>Notes to help read this report. The first four terms are explained using official sources; the last three describe how the terms are used in this report (an editorial reading aid).</p></div>
  <div class="gloss">${D.glossary.map(g=>`<div class="gl"><h3>${esc(g.t)}</h3><p>${esc(g.d)}</p>${g.src?`<div class="src">Source: ${g.url?`<a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.src)}</a>`:esc(g.src)}${g.date?` / checked ${esc(g.date)}`:''}</div>`:''}</div>`).join('')}</div></div>`;

ROUTES.about=()=>crumbs([{t:'Summary',h:'top'},{t:'Preface and about the study'}])+`<div class="wrap"><figure class="pfig"><div class="pimg"><img src="../group.jpg" alt="Group photo of the students who took part in the study" width="1800" height="1350"><div class="plabel"><h1 style="margin:0;font-size:inherit"><b>Preface</b></h1></div><div class="pdots" aria-hidden="true"><i></i><i></i></div></div><figcaption>At the airport on the day we left for Denmark</figcaption></figure></div><div class="wrap reader">
  <nav class="toc"><span class="grp">ABOUT</span><a href="#about" aria-current="true">Preface</a><a href="#report">Report: Abstract</a><a href="#ch2">Chapter 2: Overview of the study</a><a href="#glossary">Appendix D: Glossary</a></nav>
  <article class="doc">
   <p style="text-indent:0;font-family:var(--f-pop);font-weight:700;font-size:18px;line-height:1.9">${esc(D.preface[0])}</p>
   ${D.preface.slice(1).map((p,i)=>i===3?`<div class="pq"><p>${esc(p)}</p></div>`:`<p>${esc(p)}</p>`).join('')}
   <div class="authors" style="margin-top:8px;font-family:var(--f-pop)"><span class="fine" style="align-self:center">Research and writing</span>
    <div class="author"><img src="../furukita.jpg" alt="Photo of Saeri Kogita" width="84" height="84">Saeri Kogita</div>
    <div class="author"><img src="../kaji.jpg" alt="Photo of Masaki Kaji" width="84" height="84">Masaki Kaji</div></div>
   <h2>How the study was done</h2>
   ${blockHTML('table1')}
   <div class="callout" style="font-family:var(--f-pop)"><h4>About this web edition</h4><p>This site uses the summary edition (16 pages) as its entry point and is built from the text and appendices of the full report (64 pages, in Japanese). Figures in the charts and text have been checked against the survey data. A few figures in the printed report that predate the final tally (numbers of respondents and percentages) have been corrected here to match Appendix A. The English text is a translation of the Japanese report; Danish respondents’ answers and the interviews are shown in their original English.</p></div>
   <h2>Credits</h2>
   <p style="text-indent:0">Thinking together about children’s futures and sustainable schools: a comparative study of learning environments in Japan (Miyama) and Denmark<br>Published by: NPO Communities Nature Education Project<br>Research and writing: Saeri Kogita, Masaki Kaji<br>Published: 20 October 2026</p>
  </article></div>`;

/* ---------- router ---------- */
const DEPTH={top:1};THEMES.forEach(t=>DEPTH[t.id]=2);
const NAVKEY=id=>id==='top'?'top':THEMES.some(t=>t.id===id)?'theme':(id==='report'||CH.some(c=>c.id===id)||id==='about')?'report':['voices','interview','data'].includes(id)?id:'';
function route(){
  let h=(location.hash||'#top').slice(1)||'top', anchor=null;
  let m=h.match(/^((?:ch\d|abstract))-s(\d+)$/); if(m){anchor=h;h=m[1]}
  m=h.match(/^voices-(b\d)-(\d)$/); if(m){anchor=h.slice(7);h='voices'}
  m=h.match(/^data-(a\d+)$/); if(m){anchor=h;dset=['a1','a2','a3'].includes(m[1])?'parent':'teacher';h='data'}
  m=h.match(/^interview-([ts]\d)$/); if(m){anchor=h;h='interview'}
  if(h==='compare'){h='top';anchor='compare'}
  if(!ROUTES[h]){h='top'}
  const v=$('#view'); v.classList.remove('enter'); void v.offsetWidth;
  v.innerHTML=ROUTES[h]()+footer(); v.classList.add('enter');
  if(h==='voices'){renderVoices();bindVoices()} if(h==='interview'){renderInterview();bindInterview()} if(h==='data'){renderData();bindData()}
  const d=DEPTH[h]||3; const dp=$('.depth'); dp.dataset.d=d; $('#depthLabel').textContent=['','Summary','Themes','Report & data'][d];
  document.querySelectorAll('.nav a[data-n]').forEach(a=>a.setAttribute('aria-current',String(a.dataset.n===NAVKEY(h))));
  const t=anchor&&document.getElementById(anchor);
  if(t){requestAnimationFrame(()=>t.scrollIntoView({block:'start'}))} else window.scrollTo(0,0);
  document.title=(h==='top'?'':(titleOf(h)+' | '))+'Miyama × Denmark Education Study';
}
function titleOf(h){const t=THEMES.find(x=>x.id===h);if(t)return t.title;const c=CH.find(x=>x.id===h);if(c)return c.id==='abstract'?'Abstract':c.no+': '+c.title;return {voices:'Free-text answers',interview:'Interviews',data:'Survey data',glossary:'Glossary',about:'Preface'}[h]||''}
function bindVoices(){
  document.querySelectorAll('.seg-ctl[data-k]').forEach(c=>c.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;vf[c.dataset.k]=b.dataset.v;renderVoices()}));
  const q=$('#vq'); q.value=vf.q; q.addEventListener('input',()=>{vf.q=q.value;renderVoices()});
}
function bindInterview(){$('#ilang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ilang=b.dataset.v;renderInterview()})}
function bindData(){$('#dset').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;dset=b.dataset.v;renderData()})}
function footer(){return `<footer class="foot"><span class="c1" aria-hidden="true"></span><span class="c2" aria-hidden="true"></span><div class="wrap">
  <h2>Children’s futures,<br>together.</h2>
  <p style="font-weight:700;max-width:40em;line-height:1.9">Amid nature and the warm involvement of the local community, the foundation for children to develop “the ability to live authentically” is already alive in Miyama. Learning from each other, with Miyama and Denmark as a “mirror for dialogue” for one another, will open up that future.</p>
  <div><span class="rart" lang="da">Her er rart.</span> <span style="font-weight:700;font-size:14px">It’s nice here. — from a Danish teacher’s answer</span></div>
  <a class="cta" href="https://edu-project.jp/contact" target="_blank" rel="noopener">Contact us (edu-project.jp/contact)</a>
  <div class="row"><div><strong style="font-weight:900;font-size:15px">NPO Communities Nature Education Project</strong><br>Research and writing: Saeri Kogita / Masaki Kaji<br>Published 20 October 2026</div>
  <div style="font-family:var(--f-num);font-weight:700;letter-spacing:.12em;text-align:right">2026 EDUCATION FIELD REPORT<br>MIYAMA × DANMARK</div></div>
  <p style="font-size:13px;line-height:1.8">Our sincere thanks to the teachers and parents of Miyama and Gribskov, and to the teachers and students of Nordstjerneskolen, who took part in this study.</p>
 </div></footer>`}
window.addEventListener('hashchange',route);
route();
})();
</script>
