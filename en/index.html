<style>
/* Layout: 3 layers stacked like sheets. L1 概要（ポップ・大きな数字）→ L2 テーマ（色帯＋グラフ）→ L3 本編・資料（読み物・表）。黄＝美山、青＝デンマーク、ミント＝共通 */
:root{
  --bg:#FFFBF2; --surface:#FFFFFF; --sunk:#F5EFE1; --ink:#1E2A4A; --ink-2:#56607A; --line:#E7DFCC;
  --mi:#FFCF2E; --dk:#3FB8F0; --both:#4FD1A8; --coral:#FF6B4A; --on-accent:#1E2A4A;
  --lilac:#C7B6FF; --mi-soft:#FFF1C2; --dk-soft:#DDF2FC; --both-soft:#D7F5EA; --coral-soft:#FFE6DE;
  --neu:#D9D2C1; --neg:#B9C3D6;
  --f-pop:'Outfit','Zen Maru Gothic','Hiragino Maru Gothic ProN','BIZ UDPGothic',sans-serif;
  --f-read:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --f-num:'Outfit','Zen Maru Gothic',system-ui,sans-serif;
  --blend:multiply;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A2E; --surface:#1A2440; --sunk:#0E1526; --ink:#F6F0E2; --ink-2:#AEB6CB; --line:#2B3657;
  --mi:#FFCF2E; --dk:#3FB8F0; --both:#4FD1A8; --coral:#FF7C5E; --on-accent:#1E2A4A;
  --mi-soft:#3A3217; --dk-soft:#14344A; --both-soft:#123A30; --coral-soft:#43251F;
  --neu:#46506C; --neg:#33405F; --blend:screen; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A2E; --surface:#1A2440; --sunk:#0E1526; --ink:#F6F0E2; --ink-2:#AEB6CB; --line:#2B3657;
  --mi:#FFCF2E; --dk:#3FB8F0; --both:#4FD1A8; --coral:#FF7C5E; --on-accent:#1E2A4A;
  --mi-soft:#3A3217; --dk-soft:#14344A; --both-soft:#123A30; --coral-soft:#43251F;
  --neu:#46506C; --neg:#33405F; --blend:screen; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-pop);font-weight:500;font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--dk);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-num);font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:900;line-height:1.35}
p{margin:0}
.mi{color:var(--on-accent);background:var(--mi)} .dk{color:var(--on-accent);background:var(--dk)} .both{color:var(--on-accent);background:var(--both)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;font-weight:700;font-size:13px;white-space:nowrap}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:900;font-size:15px;line-height:1.2}
.brand .dots{position:relative;width:34px;height:24px;flex:none}
.brand .dots i{position:absolute;top:0;width:24px;height:24px;border-radius:50%;mix-blend-mode:var(--blend)}
.brand .dots i:first-child{left:0;background:var(--mi)} .brand .dots i:last-child{left:10px;background:var(--dk)}
.brand small{display:block;font-family:var(--f-num);font-weight:600;font-size:10px;letter-spacing:.14em;color:var(--ink-2)}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{text-decoration:none;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="true"]{background:var(--ink);color:var(--bg)}
.depth{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.depth .lv{display:flex;flex-direction:column;gap:2px}
.depth .lv span{display:block;height:4px;border-radius:2px;background:var(--line);transition:background .3s,width .3s}
.depth .lv span:nth-child(1){width:26px}.depth .lv span:nth-child(2){width:20px;margin-left:3px}.depth .lv span:nth-child(3){width:14px;margin-left:6px}
.depth[data-d="1"] .lv span:nth-child(1),.depth[data-d="2"] .lv span:nth-child(-n+2),.depth[data-d="3"] .lv span{background:var(--ink)}
@media (max-width:720px){.depth{display:none}.nav{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}.nav a{flex:none}}

/* crumbs */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-2);padding-block:18px 0}
.crumbs a{text-decoration:none;font-weight:700}.crumbs a:hover{text-decoration:underline}
.crumbs .sep{opacity:.5}
.layer-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-weight:800;font-size:11px;letter-spacing:.12em;border:1.5px solid currentColor;border-radius:999px;padding:1px 10px}

/* view transition */
#view{min-height:60vh}
.enter{animation:rise .45s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{transform:translateY(18px) scale(.985);opacity:.4}to{transform:none;opacity:1}}

/* HOME hero */
.hero{position:relative;overflow:hidden;padding-block:56px 40px}
.hero .circles{position:absolute;right:-60px;top:-40px;width:520px;height:440px;pointer-events:none}
.hero .circles i{position:absolute;border-radius:50%;mix-blend-mode:var(--blend);opacity:.95}
.hero .circles i:nth-child(1){width:300px;height:300px;left:40px;top:40px;background:var(--mi)}
.hero .circles i:nth-child(2){width:260px;height:260px;left:220px;top:10px;background:var(--dk)}
.hero .circles i:nth-child(3){width:220px;height:220px;left:170px;top:210px;background:var(--both)}
.hero .circles b{position:absolute;font-family:var(--f-pop);font-weight:900;font-size:22px;color:var(--on-accent)}
.hero-inner{position:relative;display:flex;flex-direction:column;gap:22px;max-width:640px}
.hero h1{font-size:clamp(30px,5.4vw,54px);line-height:1.3}
.hero .sub{font-weight:700;font-size:clamp(16px,2vw,19px)}
.hero .pair{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:900;font-size:18px}
@media (max-width:720px){.hero .circles{right:-220px;top:-90px;opacity:.55}}
.voices97{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:8px}
.v97{background:var(--surface);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line)}
.v97 .n{font-family:var(--f-num);font-weight:800;font-size:38px;line-height:1}
.v97 .n small{font-family:var(--f-pop);font-size:14px;margin-left:2px}
.v97 .l{font-size:13px;font-weight:700}
.v97 .bar{height:6px;border-radius:3px;margin-bottom:6px}
@media (max-width:820px){.voices97{grid-template-columns:repeat(2,minmax(0,1fr))}.v97:last-child{grid-column:1/-1}}

section.band{padding-block:56px}
.sec-head{display:flex;flex-direction:column;gap:8px;margin-bottom:26px}
.sec-head h2{font-size:clamp(24px,3.4vw,34px)}
.sec-head p{color:var(--ink-2);max-width:62ch}

/* findings */
.finds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.finds{grid-template-columns:1fr}}
.find{position:relative;display:flex;flex-direction:column;gap:12px;text-decoration:none;background:var(--surface);border-radius:28px;padding:24px;border:1px solid var(--line);transition:transform .2s}
.find:hover{transform:translateY(-3px)}
.find .k{position:absolute;right:18px;top:14px;font-family:var(--f-num);font-weight:800;font-size:56px;line-height:1;color:var(--line)}
.find .vs{display:flex;gap:18px;align-items:flex-end}
.find .vs div{display:flex;flex-direction:column}
.find .big{font-family:var(--f-num);font-weight:800;font-size:46px;line-height:1}
.find .big small{font-size:18px}
.find .who{font-size:12px;font-weight:700}
.find .q{font-weight:900;font-size:17px;line-height:1.55}

.go{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:14px}
.go::after{content:"→";font-family:var(--f-num)}

/* themes grid */
.themes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.tcard{grid-column:span 2;display:flex;flex-direction:column;gap:10px;text-decoration:none;border-radius:28px;padding:22px 22px 20px;color:var(--on-accent);min-height:220px;position:relative;overflow:hidden;transition:transform .2s}
.tcard:hover{transform:translateY(-3px)}
.tcard:nth-child(4),.tcard:nth-child(5){grid-column:span 3}
.tcard .ring{position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;border:18px solid rgba(255,255,255,.35)}
.tcard h3{font-size:22px}
.tcard .stat{font-family:var(--f-num);font-weight:800;font-size:40px;line-height:1;margin-top:auto}
.tcard .stat small{font-family:var(--f-pop);font-size:14px;font-weight:700;margin-left:6px}
.tcard p{font-size:14px;font-weight:700;max-width:34ch}
@media (max-width:900px){.themes{grid-template-columns:1fr}.tcard,.tcard:nth-child(4),.tcard:nth-child(5){grid-column:auto;min-height:0}}

/* layers diagram */
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;position:relative}
.layer{position:relative;padding:22px;border-radius:28px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.layer:nth-child(2){transform:translateY(18px);margin-left:-14px;box-shadow:-10px 0 0 -2px var(--bg)}
.layer:nth-child(3){transform:translateY(36px);margin-left:-14px;box-shadow:-10px 0 0 -2px var(--bg)}
.layer h3{font-size:20px}
.layer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.layer li a{text-decoration:none;font-weight:700;display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.layer li a:hover{color:var(--coral)}
.layer li .num{color:var(--ink-2);font-weight:600}
@media (max-width:900px){.layers{grid-template-columns:1fr;gap:12px}.layer:nth-child(n){transform:none;margin-left:0;box-shadow:none}}

/* charts */
.chart{background:var(--surface);border-radius:24px;border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.chart h4{margin:0;font-weight:900;font-size:16px;line-height:1.5}
.chart .cap{font-size:12px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.dumb{display:flex;flex-direction:column;gap:2px}
.drow{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:12px;align-items:center;padding:6px 8px;border-radius:12px}
.drow.dkwin{background:var(--sunk)}
.drow .lab{font-size:14px;font-weight:700;line-height:1.45}
.drow .lab .qn{font-family:var(--f-num);font-weight:800;font-size:11px;color:var(--ink-2);margin-right:6px}
.track{position:relative;height:30px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.track .span{position:absolute;top:calc(50% - 3px);height:6px;border-radius:3px;background:var(--neu)}
.track .dot{position:absolute;top:calc(50% - 8px);width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid var(--surface)}
.track .val{position:absolute;top:-2px;font-family:var(--f-num);font-weight:700;font-size:12px;white-space:nowrap}
.axis{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:12px;padding:0 8px;font-family:var(--f-num);font-size:11px;color:var(--ink-2)}
.axis div:last-child{display:flex;justify-content:space-between}
@media (max-width:640px){.drow,.axis{grid-template-columns:1fr;gap:2px}.axis div:first-child{display:none}}
.pbars{display:flex;flex-direction:column;gap:14px}
.pb .lab{font-size:14px;font-weight:700;line-height:1.5;margin-bottom:4px}
.pb .row{display:grid;grid-template-columns:5.5em minmax(0,1fr) 6.2em;gap:8px;align-items:center;font-size:12px}
.pb .row .who{font-weight:700;color:var(--ink-2)}
.pb .row .b{height:14px;border-radius:7px;background:var(--sunk);overflow:hidden}
.pb .row .b i{display:block;height:100%;border-radius:7px}
.pb .row .v{font-family:var(--f-num);font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.pb .row .v small{font-weight:600;color:var(--ink-2);margin-left:5px}
.pb.hot{background:var(--coral-soft);border-radius:14px;padding:8px 10px;margin:0 -10px}
.lk{display:flex;flex-direction:column;gap:12px}
.lkrow .lab{font-size:14px;font-weight:700;line-height:1.5;margin-bottom:4px}
.lkbar{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;margin-top:3px}
.lkbar .who{font-weight:700;color:var(--ink-2)}.lkbar .cnt{min-width:10.5em;text-align:right;font-family:var(--f-num);font-weight:600;font-size:11.5px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}@media (max-width:640px){.lkbar{grid-template-columns:5.5em minmax(0,1fr)}.lkbar .cnt{grid-column:2;text-align:left;min-width:0}}
.seg{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--sunk)}
.seg i{display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--f-num);font-weight:700;font-size:11px;color:var(--on-accent);min-width:0;overflow:hidden;white-space:nowrap}
.seg i.neu{background:var(--neu);color:var(--ink)} .seg i.neg{background:var(--neg);color:var(--ink)}
.slope{width:100%;height:auto;display:block}
.slope text{font-family:var(--f-pop);font-weight:700}

/* theme page */
.tband{color:var(--on-accent);padding-block:40px 44px;position:relative;overflow:hidden}
.tband .ring{position:absolute;right:-80px;top:-60px;width:320px;height:320px;border-radius:50%;border:44px solid rgba(255,255,255,.3)}
.tband .wrap{display:flex;flex-direction:column;gap:14px;position:relative}
.tband h1{font-size:clamp(28px,4.4vw,44px)}
.tband .head{font-weight:900;font-size:clamp(18px,2.4vw,24px);line-height:1.5;max-width:30em}
.tband .stats{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.tband .stats div{display:flex;flex-direction:column}
.tband .stats .big{font-family:var(--f-num);font-weight:800;font-size:clamp(44px,7vw,72px);line-height:1}
.tband .stats .big small{font-size:.4em}
.tband .stats .who{font-weight:900;font-size:14px}
.tbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;padding-block:32px}
.tbody > *{min-width:0}.tbody > .full{grid-column:1/-1}
@media (max-width:900px){.tbody{grid-template-columns:1fr}}
.prose{display:flex;flex-direction:column;gap:14px;font-size:16px;line-height:1.95;max-width:40em}
.prose strong{font-weight:900;background:linear-gradient(transparent 62%,var(--mi-soft) 0)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fact{background:var(--dk-soft);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}

.fact .n small{font-family:var(--f-pop);font-size:13px;margin-left:2px}
.fact .l{font-size:13px;font-weight:700;line-height:1.4}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.quote{border-radius:26px 26px 26px 6px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;font-weight:700;line-height:1.75}
.quote.mi{background:var(--mi-soft);color:var(--ink)} .quote.dk{background:var(--dk-soft);color:var(--ink)}
.quote .src{font-size:12px;font-weight:700;color:var(--ink-2)}
.quote .en{font-family:var(--f-num);font-weight:500;font-size:13px;color:var(--ink-2)}
.compare2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

@media (max-width:640px){.compare2{grid-template-columns:1fr}}

/* deeper panel */

.deeper h3{font-size:22px}
.deeper .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;position:relative}
.deeper a{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:color-mix(in srgb,var(--bg) 8%,transparent);border:1px solid color-mix(in srgb,var(--bg) 22%,transparent);border-radius:20px;padding:14px 16px;transition:background .2s}
.deeper a:hover{background:color-mix(in srgb,var(--bg) 16%,transparent)}
.deeper a .t{font-weight:900;font-size:15px;line-height:1.5}

.deeper a .layer-tag{align-self:flex-start;opacity:.9}

27, "hot": "The school’s policies and daily life are hard to see, and there are not enough channels or opportunities to share views or consult", "note": "Source: Appendix A, Tables A-2 and A-5. One of the four “Other” answers in Miyama was blank (“。” only). Comments are in Appendix B.", "rows": [{"label": "The school’s policies and daily life are hard to see, and there are not enough channels or opportunities to share views or consult", "mi": 7, "dk": 1}, {"label": "Support for diverse needs (school avoidance, developmental traits, multicultural backgrounds) is insufficient", "mi": 7, "dk": 9}, {"label": "Teachers are too busy with daily duties to spend time with each child", "mi": 5, "dk": 7}, {"label": "There is a gap between school and home/community in the abilities and educational approach they value", "mi": 4, "dk": 2}, {"label": "I don’t feel there are any particular issues", "mi": 6, "dk": 11}, {"label": "Other", "mi": 4, "dk": 3}]}, "q7": {"nMi": 26, "nDk": 27, "note": "Source: Appendix A, Tables A-3 and A-6. Miyama “Other”: skills for living / ability to solve problems oneself / foundations of knowledge, virtue and body, and the will to grow.", "rows": [{"label": "Living authentically and self-esteem", "short": "Self-esteem", "mi": 11, "dk": 6}, {"label": "Having and expressing one’s own opinions", "short": "Self-expression", "mi": 11, "dk": 10}, {"label": "Courage to take on challenges without fear of failure, resilience", "short": "Challenge", "mi": 9, "dk": 5}, {"label": "Cooperating and collaborating with others", "short": "Cooperation", "mi": 8, "dk": 8}, {"label": "Respect for social rules and discipline", "short": "Rules", "mi": 3, "dk": 8}, {"label": "High academic ability and knowledge", "short": "Academics", "mi": 3, "dk": 16}, {"label": "Other", "short": "Other", "mi": 3, "dk": 0}]}, "q14": {"nMi": 15, "nDk": 23, "note": "Source: Appendix A, Tables A-8 and A-11. The Miyama “Other” comment is in Appendix B. One Danish respondent answered “???” (not counted).", "rows": [{"label": "Gathering students’ views through the student council and committees (participation in decisions)", "mi": 11, "dk": 6}, {"label": "Special classes and joint events with local residents or companies", "mi": 8, "dk": 5}, {"label": "Inquiry learning or volunteering on local issues", "mi": 8, "dk": 4}, {"label": "Stronger everyday conversations and counselling (student well-being)", "mi": 6, "dk": 13}, {"label": "Multifaceted assessment beyond regular tests", "mi": 4, "dk": 6}, {"label": "Other", "mi": 1, "dk": 0}]}, "q15": {"nMi": 15, "nDk": 23, "note": "Source: Appendix A, Tables A-9 and A-12. “Other” comments: the inconveniences of a remote area / schools’ understanding, skills and mindset have not kept up with major social change (Miyama); “I think the government should focus more on the educational system, economy etc.” (Denmark).", "rows": [{"label": "Too busy with daily duties and covering the curriculum to take on anything new", "mi": 13, "dk": 19}, {"label": "A gap in awareness about education between the school and parents/residents", "mi": 1, "dk": 8}, {"label": "Lack of practical know-how to assess and support students’ diverse needs", "mi": 3, "dk": 5}, {"label": "Lack of staff or contact points to coordinate with the community and outside companies", "mi": 3, "dk": 0}, {"label": "Other", "mi": 2, "dk": 1}]}}, "voices": [{"id": "B-1", "region": "mi", "role": "parent", "n": 26, "title": "B-1", "sections": [{"no": 1, "title": "Dialogue with the school and relationships with teachers (related to Q1–Q3)", "items": [{"ja": "電話ではなく連絡できるメールやアプリなどがあればもっと気軽に連絡をとりあえるのでは？", "en": "Wouldn’t it be easier to keep in touch if there were email or an app we could use instead of the phone?"}, {"ja": "小学校でも教科担任制を導入して、先生が子供から離れる時間を確保すること。予約を取り戻すための時間を確保してほしい。学校への連絡は連絡ノートを使いますが、子供が出すのを忘れたり、子供のことでも本人に知られたくない内容はそこに書きにくい…となると伝えにくいという状態になってしまっていると思います。", "en": "Introduce subject-specialist teaching in elementary school too, so teachers get time away from the children. I want them to have time to get their breathing room back [the original says “reservations,” probably a slip for “breathing room”]. We use a contact notebook to communicate with the school, but children forget to hand it in, and it’s hard to write things you don’t want your child to know about, even if they concern the child… so it ends up being hard to tell the school things."}, {"ja": "家庭訪問や二者面談はあるが、それ以外に話す機会がなく(こちらから話にいけば話はできるとは思うがそこまでするのも遠慮してしまう)、もう少し普段思ってること、困ってることなどを気軽に話せたらよいなと思う。", "en": "There are home visits and parent–teacher meetings, but no other chances to talk (I think I could talk if I went to the school myself, but I hold back from going that far). I wish I could talk more casually about what I usually think or what I’m struggling with."}, {"ja": "美山小学校と美山中学校。先生と保護者との関わり方が極端に違いすぎる。まず、面談。小学校は気さくに話進む。普段の先生の言葉。子供たちにも保護者にも同じような気がする。でも、中学校はマニュアルすぎる話がほとんど。全ての先生ではないが、こどもに言わせてる感あり。面談は顔みて話してほしい。20分ほどしか時間ないのに画面みて進められたら 話にならん。", "en": "Miyama Elementary and Miyama Junior High: the way teachers relate to parents is extremely different. First, the meetings. At elementary school the conversation flows easily. Teachers’ everyday words feel the same towards children and parents. But at junior high, it’s mostly by-the-book talk. Not every teacher, but it feels like they make the children say things. I want them to look me in the face during meetings. With only about 20 minutes, if they spend it looking at a screen, it’s pointless."}, {"ja": "PTAという名前だけの学校からの接触が強く感じられ、PTAより子供と向き合う教育がもう少し欲しく思います。", "en": "I feel strongly that the school contacts us only in the name of the PTA; I’d like a bit more education that faces the children rather than the PTA."}, {"ja": "対話が必要そうな時はすぐに学校へ足を運ぶ、もしくは電話をして情報を得ているので、必要最低限の対話はできていると思います。学校側の対応も良い方だと思っています。ただ見るからに先生方が忙しそうなので、その皺寄せは子供達への対応や時間割に出ているのではとも思いますが。。。", "en": "When dialogue seems necessary I go to the school right away or call to find out, so I think the minimum dialogue is there. I think the school responds fairly well too. But teachers look so busy that I suspect the strain shows up in how children are dealt with and in the timetable…"}, {"ja": "Q3については、子どもから聞いた話にはなるが、授業で分からない所があった時、先生に聞きに行ったが、後で…と言われる事が何度かあったり、少し先生の機嫌が悪そうで話しかけにくい時があった。", "en": "About Q3: this is what my child told me, but several times when they went to ask the teacher about something they didn’t understand in class, they were told “later…”, and sometimes the teacher seemed in a bad mood and was hard to talk to."}, {"ja": "働き方改革と言われると、先生も大変なのでは？と思うとこれくらいの相談はやめておこう、と思ってしまうことがある", "en": "When people talk about work-style reform, I think “teachers must be having a hard time too,” and sometimes I decide not to bother them with something this small."}, {"ja": "先生の業務や学校の目指すところへの保護者の理解度が人によって異なる（理解したいという度合いも異なるし、学校に求めることの多さも様々）相互理解が必要", "en": "Parents differ in how well they understand teachers’ work and the school’s goals (they differ in how much they want to understand, and in how much they ask of the school). Mutual understanding is needed."}, {"ja": "先生方は子たちの日々を見てもらうことと英気養う時間を大切にしてもらいたいので、保護者対応は最小限でよいかと思う。ただ、任意で保護者が学校や子たちのために活動する機会・窓口はあるとよい。", "en": "I want teachers to value time to watch over the children each day and to recharge, so I think dealing with parents can be kept to a minimum. Still, it would be good to have voluntary opportunities and a contact point for parents to do things for the school and the children."}], "note": ""}, {"no": 2, "title": "Respect for individuality and cooperation, and how children are assessed (related to Q4–Q5)", "items": [{"ja": "小学校は全体評価と感じるが、中学校はそうではないように感じる。", "en": "In elementary school assessment feels holistic, but not so in junior high."}, {"ja": "運動ができる子は、運動会や持久走大会など、目立つ、わかりやすく評価されますが、運動が苦手な子たちにとってはやりたくない、苦手、できないことをたくさんの人の前でやらなくてはいけないという場でもあります。またそういった子が、他で評価されるかといえば、勉強面での評価は運動会のように大きく分かりやすいものではないので、どうしても自己評価も下がってしまいがちだと感じています。それぞれの得意を評価してあげられる、目に見える形にしてあげる、というような取り組みがあればいいのになぁと思います。", "en": "Children who are good at sports are noticed and easily recognised at sports days and long-distance races, but for children who are not, these are occasions where they have to do things they don’t want to, aren’t good at or can’t do in front of many people. And are those children recognised elsewhere? Academic recognition isn’t as big and visible as a sports day, so their self-esteem tends to drop. I wish there were efforts to recognise each child’s strengths and make them visible."}, {"ja": "その点についてはあまりわかってないので、逆に学校としてどのような対応をしているのか詳しく知りたい。", "en": "I don’t really know about this, so I’d actually like to know in detail what the school does."}, {"ja": "そもそも先生と生徒という関係性で、且つ、学校生活の中だけで子ども一人ひとりの個性を「評価をする」ということ自体が無意味だし無茶だと思います。テストの採点ならばもちろん数値化は出来ますが、内申書というのは本当に難しいですね。", "en": "In the first place, I think it is meaningless and unreasonable to “assess” each child’s individuality within a teacher–student relationship and within school life alone. Test scores can of course be quantified, but school reports (naishinsho) are really difficult."}, {"ja": "人と話すのが苦手な子ですが、本人が話すまで待ってくださったり、担任の先生ではなく、本人が話しやすい先生に話してもらうようにしてくださり、子ども自身も、何か言いたい事があっても話せないから聞いてもらえないという半分諦めのような態度から一変し、先生に相談しにいくようになったので、良かったです。", "en": "My child finds it hard to talk to people, but teachers waited until they were ready to speak and arranged for them to talk to a teacher they find easy to talk to rather than the homeroom teacher. My child changed from a half-resigned attitude of “I can’t say what I want, so no one will listen” to going to teachers for advice, which was good."}, {"ja": "発達特性グレーの子がいますが、学校生活様々な場面で、押し付けず、気持ちを尊重してくださっていると感じます。一見すると問題がある行動にも、必ず理由があると理解してくださっています。そのため、子どもも生き生きと過ごしています。漢字が苦手ですが、通級指導の先生と担任の先生とで、漢字テストを記述式から選択式にして点を取れるようにしてはどうか？と言ってくださっています。", "en": "One of my children is in the “grey zone” for a developmental trait, and I feel teachers respect their feelings in many situations without forcing things. They understand that even behaviour that seems problematic always has a reason, so my child is lively at school. My child struggles with kanji, and the resource-room teacher and homeroom teacher have suggested changing kanji tests from written to multiple choice so they can score points."}, {"ja": "美山小学校に限っていえば、少人数のため個別の子どもたちの特性や性格を普段から理解してもらっているように思う", "en": "At least at Miyama Elementary, because classes are small, I think teachers understand each child’s traits and personality in everyday life."}, {"ja": "美山は少人数なので個別をよく見てくれていると思う。周りに合わせるというより、それぞれを尊重しあったり、自由と秩序の折り合いがどんな現状なのか、評価の仕組みがどうなっているのか分からない。", "en": "Miyama is small, so I think they look closely at each child. Rather than making children fit in, they respect each other… but I don’t know how freedom and order are balanced in practice or how assessment works."}, {"ja": "個性の尊重ももちろん大切ですが学校では集団生活、気の合う合わない人とも過ごしていく協調性を学ぶ場だと思うのであまりにも個々を主とした教育方針になることは避けたいと感じます。今の美山小学校ではもちろん一人一人も大切にして頂いているし、縦横での協調性も育まれとてもありがたく感じています。", "en": "Respecting individuality is of course important, but I think school is a place for group life, for learning to cooperate with people you do and don’t get along with, so I’d rather avoid an educational approach that is too focused on individuals. At Miyama Elementary now, each child is valued and cooperation across and between grades is also nurtured, which I’m very grateful for."}], "note": ""}, {"no": 3, "title": "Comments from those who chose “Other” for “the biggest issue” (Q6)", "items": [{"ja": "保育所→小学校、小学校→中学校と子どもの特徴や個性や行事等の連携があまりなくまた一からスタートと言う感じがする。", "en": "From nursery to elementary and from elementary to junior high, there is little continuity about children’s characteristics, personalities or events, so it feels like starting again from scratch."}, {"ja": "先生の働き方に関しては、課題を感じます。1人ひとりとじっくりと向きあってくださっているので、設問が難しい。。", "en": "I do see issues with teachers’ working conditions. But they take time to face each child, so the question was hard to answer…"}, {"ja": "時間割が詰め詰めで、子供たちの選択が全くないため、自主性や責任意識も、創造性も育まれていない。", "en": "The timetable is packed and children have no choices at all, so neither independence, responsibility nor creativity is being nurtured."}], "note": "* One more respondent chose “Other” and wrote only “。”."}, {"no": 4, "title": "“The biggest barrier” in school education and ideas for solving it", "items": [{"ja": "保護者と学校の話し合い定期に行う事", "en": "Hold regular discussions between parents and the school."}, {"ja": "学力の把握。過去と比べて、落ちているか、把握すらできていないのではないかという危惧がある", "en": "Understanding of academic levels. I worry that levels are falling compared with the past, or that no one is even keeping track."}, {"ja": "学校と言う場所をもっと保護者や地域の方が集まる場所になれば行きやすくなるのでは？", "en": "If the school became more of a place where parents and local people gather, wouldn’t it be easier to go there?"}, {"ja": "当たり前のことですが保護者の温度感が各家庭違うので、足並みが揃わない。地域、学校、いろんな取り組みをしているが、興味のない保護者はとこちん興味がなさそう。", "en": "Obviously, every family’s level of interest is different, so we can’t move in step. The community and school run various initiatives, but parents who aren’t interested seem completely uninterested."}, {"ja": "多様なニーズへの対応は不十分かもしれないが、学校だけが支援・対応しなくていいと思うので、、、。でも、そうなると田舎は特に選択肢が少ない、または通う大変さがあると感じる。", "en": "Meeting diverse needs may not be enough, but I don’t think the school alone has to provide support… But then in the countryside especially there are few options, or it’s hard to travel to them."}, {"ja": "1人1人のレベルにあった教育かと言われるとそうとは思えず、我が家の場合は兄弟の中で勉強についていくことに苦労してる子もいますまた担任の先生の威圧感や厳しさにストレスを感じていて、その日の授業の内容を覚えていなかったりします(怖い、怒鳴られている友達がいるだけで頭が真っ白になるなどして)先生の余裕という意味もありますが、いまだに大声で怒鳴る、先生の機嫌で怒られるなどがあるというのが不安のもとです。先生の余裕を生み出していただき、また生徒への指導に適切で必要な指導方法が徹底されてほしいと感じます", "en": "I can’t say the teaching matches each child’s level; among my children, one struggles to keep up with lessons. They also feel stressed by the homeroom teacher’s intimidating manner and strictness and sometimes can’t remember what was taught that day (their mind goes blank just because a friend is being yelled at, and so on). This is also about teachers’ capacity, but the fact that there is still yelling and scolding depending on the teacher’s mood is a source of worry. I want teachers to be given more room, and appropriate, necessary methods of guidance to be applied thoroughly."}, {"ja": "日本の教育を受けてきた人たちが先生をしているし、私もそうやって育ってきたので、どんな方法があるのかわからないけど、実現可能なもっと多様な教育の方法があるなら、まずは知りたいし、話し合っていけたら良いと思う。", "en": "The teachers were educated in the Japanese system, and so was I, so I don’t know what other approaches exist; but if there are more diverse, feasible ways of educating, I’d first like to know about them and talk about them together."}, {"ja": "中学校と地域との関わり。先生が地域のことを知らなさすぎる。かやぶきだけではありません。小学校は地域の方がどんどん校舎の中に入って生徒だけでなく先生との交流もある。中学校は全くといってない。", "en": "The junior high school’s relationship with the community. The teachers know far too little about the area. It’s not only about thatched roofs. At the elementary school, local people come into the building one after another and interact not only with pupils but with teachers too. At the junior high there is almost none of this."}, {"ja": "PTAも学校に頼らず、学校もPTAに頼らず、共に子供の育成が出来れば嬉しい。", "en": "I’d be glad if the PTA didn’t lean on the school and the school didn’t lean on the PTA, and we could raise children together."}, {"ja": "人数が減少と美山町という面積の広い町での放課後のあり方が課題かなと思う。学童を必要としない子供たちの交流の場を増やせればと寺子屋のようなものを作ろうと考えている。地域住民の協力が必須である。", "en": "With falling numbers and a town as large in area as Miyama, I think after-school time is an issue. I’m thinking of creating something like a terakoya (community learning place) to give children who don’t need after-school care more places to meet. The cooperation of local residents is essential."}, {"ja": "学校での子ども達の様子がわかりにくい。", "en": "It’s hard to know how the children are doing at school."}, {"ja": "家庭は地域の一員でもあるという認識のもと、積極的に学校が地域に依頼している活動に参加し、学校の様子、子どもの様子を見る", "en": "Recognising that families are also members of the community, parents should actively join activities the school asks the community for, and see how the school and children are doing."}, {"ja": "先生の働き方。残業が多く、心配になります。地域や保護者でお手伝いできることがあると思うのですが、どのように手伝えばいいのか分かりません。", "en": "Teachers’ working conditions. They work a lot of overtime and I worry. I think there are things parents and the community could help with, but I don’t know how to help."}, {"ja": "小学校と中学校との先生の温度差を近づけてほしい せっかく小学校で伸び伸びできていたのに中学で壁にぶち当たる", "en": "I want the difference in attitude between elementary and junior high teachers to be narrowed. Children who were thriving freely in elementary school hit a wall in junior high."}, {"ja": "保護者も先生も忙しすぎる中で、子どもに過度の期待を寄せすぎている", "en": "Parents and teachers are both far too busy, and we expect too much of children."}, {"ja": "放課後遊びの環境、中学の文化系部活の充実（楽器合奏や合唱など）", "en": "After-school play environments, and better cultural clubs in junior high (instrumental ensembles, choir, etc.)."}, {"ja": "ある程度の学習能力に応じた対応（組み分け的な）、その時のクラスメイトの柔軟性の教育", "en": "Responses suited to some extent to learning ability (something like grouping), and education in flexibility for classmates at that time."}, {"ja": "それぞれの資質の向上、向き合う姿勢、共有", "en": "Improving everyone’s qualities, attitude to engaging, and sharing."}, {"ja": "美山町の広さゆえに放課後子どもたちが自分の力で友達の家へ行くことなどが難しく、送迎してもらえる家庭とそうでない家庭で放課後の過ごし方にどうしても差が出るので、現在取り組んでいただいている放課後プロジェクトや地域の方との関わりなどを活かして、学童以外の放課後の過ごし方が見つけられたらいいなと感じます。", "en": "Because Miyama is so large, it’s hard for children to go to friends’ houses on their own after school, and there’s an unavoidable difference in after-school life between families who can drive their children and those who can’t. I hope that, building on the after-school project now under way and connections with local people, ways of spending after-school time other than the after-school care programme can be found."}], "note": "* 7 answers such as “nothing in particular” or “none” are omitted."}, {"no": 5, "title": "What they hope schools and teachers will do for children’s growth (Q8)", "items": [{"ja": "子供の得意分野にもっと時間増やすのと苦手の分野を克服できるように工夫して欲しいです。", "en": "I’d like more time for children’s strengths, and for ways to help them overcome their weak subjects."}, {"ja": "先生ともっと話せる機会があれば相談などもしやすいのでは？", "en": "If there were more chances to talk with teachers, it would be easier to consult them."}, {"ja": "このまま、暖かく子供達の学校教育をお願いできたら嬉しいです。気付いた点とては、小学校に上がると子供達が標準語で話すようになってきました。日頃から、先生たちが子供達に丁寧な言葉使いで接して下さってるからかもしれませんが、家庭内でちょっと寂しくなりました。つい、「家では関西弁で喋って」とお願いしてしまいます。", "en": "I’d be happy if they keep educating the children warmly as they do now. One thing I noticed: after starting elementary school, the children began speaking standard Japanese. Maybe it’s because teachers speak to them politely every day, but it made me a little sad at home. I find myself asking, “Please speak Kansai dialect at home.”"}, {"ja": "日々子供たちに学びとより良い成長を願っているのは、親も先生方も変わらない部分だと思っています。ですが先生によって子供たちのストレス具合がこんなにも違うことはやはり悩みであり、不安です。子供たちのより良い成長のために、保護者も学校も地域も協力し合いながら良いサイクルを築いていく必要があると思います。", "en": "Parents and teachers are the same in wishing for children’s learning and better growth every day. But how much children’s stress varies depending on the teacher is a real worry and concern. For children’s better growth, I think parents, school and community need to work together to build a good cycle."}, {"ja": "好きなことをどんどん伸ばしていける、選択していける日々であれば良いと思う。", "en": "It would be good if every day let children keep developing what they love and make their own choices."}, {"ja": "小学校での学びが 中学校で途切れる。残念だ。", "en": "Learning in elementary school is cut off in junior high. It’s a shame."}, {"ja": "お忙しい中かとは思いますが、子供達に配慮する発言や行動を期待しております。", "en": "I know you are busy, but I hope for words and actions that are considerate of the children."}, {"ja": "家庭ではたっぷりの愛情を！学校ではもっと自由になる時間を作り、先生(保護者も)がもっと自由に楽しく生きることを！幸せにクリエイティブに生きている大人の中で子供は様々なことを学んで選択して、自分の選択に関心を持ち、少しづつ自信をつけていけたら良いと思います。", "en": "Lots of love at home! At school, more free time, and teachers (and parents) living more freely and joyfully! Among adults who live happily and creatively, children learn many things, make choices, take an interest in their own choices and gradually gain confidence, I think."}, {"ja": "現在の小学校校長は地域との連携や学びを大切にしていらっしゃる。素晴らしいので先生方が変わってもその方針は変わらずあってほしいと心から願っている。", "en": "The current elementary school principal values partnership and learning with the community. It’s wonderful, and I sincerely hope this approach continues even when teachers change."}, {"ja": "学校側は美山学として、子ども達にどういった学びを与えられるか、念密に考えてくださり、こまめにアップデートしてくださっているんだな、と先日のまちごとスクールミーティングのお話を聞かせていただき、とてもありがたく思っています。一方で、子ども達に寄り添った対応をするために、先生方には負担が増えているのではないかと思います。家庭が学校・地域に寄り添っていくことが必要なのではないかと感じています。", "en": "Hearing about it at the recent Machigoto School Meeting, I realised how carefully the school thinks about what learning it can offer children through Miyama Studies and how often it updates it, and I’m very grateful. On the other hand, I suspect that responding closely to children is increasing teachers’ burden. I feel families need to support the school and the community."}, {"ja": "先生方も含め生き生きと毎日を過ごしてくださっていることが、何より子どもの成長に繋がると思っています。大人になるって楽しいとおもってほしいです。", "en": "I think teachers and everyone living each day with energy is what most helps children grow. I want them to feel that being a grown-up is fun."}, {"ja": "先生の心身の健康が充実する職場、地域社会であれますように。よいときの大空小学校の映画「みんなの学校」を地域の皆さんや先生方と一緒に鑑賞できたらいのにな。", "en": "I hope for workplaces and a community where teachers’ physical and mental health thrive. I wish we could watch the film “Minna no Gakko” (Everyone’s School), about Ozora Elementary in its good days, together with local people and teachers."}, {"ja": "家庭で親から聞く言葉と「先生」という立場から教わる事では、聞く姿勢も受け取り方も違うのだなと感じます。尊敬、憧れの眼差し、好きな○○先生方から、自分なりの挑戦や良かったなと思う経験談など、たくさんの大人から話を聞ける機会があれば有難いなと思います。", "en": "I feel that children listen and take things in differently when they hear words from parents at home and when they are taught by someone in the position of “teacher.” I’d be grateful for chances to hear from many adults, including teachers they respect, admire or like, about their own challenges and experiences they are glad of."}, {"ja": "先生方には感謝しています。自分の子供でも時代の背景が否応なしに変わっていくなかで子育ての変化、大変さを感じる時もあります。そんな中先生方は時代のニーズの把握など変化に対応されていくのは大変だと思います。でも、子供達は今を生きているのでその今を輝かせてもらえる様に関わってくださっていると願っています。", "en": "I’m grateful to the teachers. Even with my own children, I feel how parenting changes and gets harder as the times inevitably change. For teachers, keeping up with the needs of the times must be hard. But children live in the present, and I hope teachers are helping them shine in that present."}], "note": ""}]}, {"id": "B-2", "region": "dk", "role": "parent", "n": 27, "title": "B-2", "sections": [{"no": 1, "title": "Dialogue with the school and relationships with teachers (related to Q1–Q3)", "items": [{"en": "Aula is bad thing, and to manny students in classroms", "ja": "Aula（学校と家庭の連絡システム）はよくない。また、1クラスの生徒数が多すぎる。"}, {"en": "Online debate platforms", "ja": "オンラインの討論プラットフォーム。"}, {"en": "Yes, the danish teachers are busy. But still we have always as parents been met by teachers who take time to talk or write on Aula, when we have questions etc. Our kids have good relations to their main-teachers.", "ja": "確かにデンマークの先生は忙しい。それでも、私たち保護者が質問をしたときには、いつも先生が時間をとって話したり、Aulaで返信したりしてくれる。子どもたちは担任の先生と良い関係を築いている。"}], "note": ""}, {"no": 2, "title": "Comments from those who chose “Other” for “the biggest issue” (Q6)", "items": [{"en": "Too many students are disrupting the class. To often substitute teachers attend in classes instread of regular teachers. Many Students do not respect teachers, caused by lack of dicipline from home.", "ja": "授業を妨げる生徒が多すぎる。正規の先生ではなく代講の先生が授業に入ることがあまりに多い。家庭でのしつけ不足が原因で、先生を尊重しない生徒が多い。"}, {"en": "Including children with diagnoses who do splitting between the children, are at problem if they don’t get at grown up to follow them. They will run around creating fires in the environment.", "ja": "子どもたちの間に分断を生む、診断のある子どもを（通常学級に）含めることは、ついてくれる大人がいないと問題になる。周囲で騒ぎを起こして回ってしまう。"}, {"en": "The gap between the students different levels and efforts with their schoolwork.", "ja": "生徒間の学力や学習への取り組みの差。"}], "note": ""}, {"no": 3, "title": "The biggest issue in school education and ideas for solving it (Danish version Q8)", "items": [{"en": "One challenge is in finding the time and resources to differentiate the levels of teaching so that they match the individual students needs more appropriately", "ja": "課題の一つは、一人ひとりの生徒のニーズにより適切に合うよう、指導のレベルを分けるための時間と資源を確保することだ。"}, {"en": "That the goverment dont put enough resorces to the school, but I feel the teachers truely do the best with what they have", "ja": "政府が学校に十分な資源を投じていないこと。ただ、先生方は今ある資源の中で本当に最善を尽くしていると感じる。"}, {"en": "They cant solve previus stated problem", "ja": "（学校は）先に挙げた問題を解決できない。"}, {"en": "Does inclusion mean that the environment will take damage and the quality will fall, and how much of that is enough or too much", "ja": "インクルージョンとは、学習環境が損なわれ、質が下がることを意味するのか。そして、どこまでなら許容範囲で、どこからが行き過ぎなのか。"}, {"en": "That some misbehaving kids are destroying it for the rest", "ja": "一部の素行の悪い子どもが、ほかの子どもたちにとっての環境を壊していること。"}, {"en": "I think that more psychological help for individuals is needed", "ja": "個々の生徒に対して、もっと心理的な支援が必要だと思う。"}, {"en": "My son was bullied for many years. And in my opinion, the efforts and support in this regard were insufficient. I hope that the school will focus more on well-being and anti-bullying in the future as it affects the students learning and the motivation to go to school.", "ja": "息子は何年もいじめを受けていた。私の考えでは、それに対する取り組みや支援は不十分だった。いじめは生徒の学習や登校意欲に影響するので、今後は学校がウェルビーイングといじめ防止にもっと力を入れてくれることを望む。"}, {"en": "Kommunikation from teachers", "ja": "先生からのコミュニケーション。"}], "note": ""}, {"no": 4, "title": "What they hope schools and teachers will do for children’s growth", "items": [{"en": "To help with general academic knowledge and the ability to resolve tasks, find information, and crave more knowledge.", "ja": "一般的な学力と、課題を解決する力、情報を見つける力、もっと知りたいと思う気持ちを育ててほしい。"}, {"en": "I hope to work more on building a stronger personality for the child.", "ja": "子どもがより強い人格を築けるよう、もっと取り組んでほしい。"}, {"en": "Be a support and a visible grown up to guide them through the learning process", "ja": "学びの過程を導く、支えとなる目に見える大人であってほしい。"}, {"en": "The main teachers in both my children’s classes are “persons” not just teachers, I think that my kids like that, and also the kids get to be other that just student for at teachers, who really “sees”the kids.", "ja": "二人の子どものクラス担任はどちらも、単なる「先生」ではなく一人の「人」として接してくれている。子どもたちはそれを好んでいると思うし、子どもも先生にとって単なる「生徒」以上の存在でいられる。先生は本当に子どもたちを「見て」くれている。"}, {"en": "Let them feel safe and confident. That it is okay to make mistakes", "ja": "子どもたちが安心して自信をもてるようにしてほしい。間違えてもいいのだと感じられるように。"}, {"en": "More relationship, and little more respect to adults", "ja": "もっと関係づくりを。そして大人に対するもう少しの敬意を。"}, {"en": "That they love teaching and inspiring students. That they prioritize well-being and class cohesion, as this is necessary for the students to be able to learn", "ja": "教えることを愛し、生徒に刺激を与えてほしい。生徒が学ぶためにはウェルビーイングとクラスのまとまりが欠かせないので、それを優先してほしい。"}, {"en": "Individual adaption to children's learning curves", "ja": "子ども一人ひとりの学習曲線（理解の進み方）に合わせた個別の対応。"}], "note": ""}]}, {"id": "B-3", "region": "mi", "role": "teacher", "n": 15, "title": "B-3", "sections": [{"no": 1, "title": "What they keep in mind about student participation and dialogue, with examples (related to Q3)", "items": [{"ja": "毎日一人ひとりと話すように努めています。話したときにはいろいろな気持ちを受け止めるようにしています。聞いたことで気になったことは関係する先生に相談しています。授業ではペアワークや考えたくなる問いかけが行われている印象です。", "en": "I try to talk with each child every day. When I do, I try to accept all kinds of feelings. If something they say concerns me, I consult the relevant teachers. In lessons, my impression is that pair work and thought-provoking questions are used."}, {"ja": "学びたい、なぜだろう、どうしてと興味を持てるように意識をしている。自然と会話が生まれるようにしていきたい。", "en": "I try to help them become curious: “I want to learn,” “I wonder why.” I want conversations to arise naturally."}, {"ja": "教員からの一方的な講義型授業ではなく、生徒間で実際にコミュニケーションをとることや、ICTを利用して自分たちの力で問題解決ができるような授業構成を意識しています。", "en": "Rather than one-way lectures by the teacher, I design lessons where students actually communicate with each other and use ICT to solve problems themselves."}, {"ja": "まずは自分で考えてやってみる。失敗でも成功でも、「やった」ことが大事で、その経験に価値付けしたり、改善したりすることが教師の役目かと。", "en": "First, think for yourself and try it. Whether it fails or succeeds, what matters is that you “did it,” and I think the teacher’s role is to give that experience meaning and help improve it."}, {"ja": "普段から教師間で児童の様子について話をしている。また、話したうえでどうアプローチするかを考え、行動している。学習の中で必ず児童の考えを言う場面を確保している。また、１日の中で全員が話すように声をかけ、意識させている。", "en": "We teachers talk about how the children are doing every day, think about how to approach them, and act on it. In learning, I always make sure there are moments for children to say what they think. I also encourage everyone to speak at least once a day and make them aware of it."}, {"ja": "ペア学習やグループ学習を取り入れる。また、ノートに自分の意見を書かせる時間を取り、自分の考えを整理できる時間を確保する。", "en": "I use pair and group learning. I also give time for them to write their opinions in their notebooks, so they can organise their thoughts."}, {"ja": "主体的な対話を引き出すため、興味のわく質問をするよう心がけたり、「なぜ」を引き出し「知りたい」となるような授業展開を目指しています。", "en": "To draw out active dialogue, I try to ask questions that spark interest and aim for lessons that draw out “why?” and lead to “I want to know.”"}, {"ja": "時間を見つけて校内を積極的に見回り、児童の様子を観察したり声かけをしたりすること", "en": "Finding time to walk around the school actively, observing the children and talking to them."}, {"ja": "自分1人の見取りだけで判断せず、いろんな立場の先生から意見を聞くことが大切だと思っています。本人の言葉も大切ですが、額面どおりに受け取ってはいけない場合もあると思います。そんなときこそ、できるだけたくさんの情報を集めます。", "en": "I think it’s important not to judge from my own observations alone but to hear from teachers in various positions. The child’s own words matter, but sometimes they shouldn’t be taken at face value. In those cases especially, I gather as much information as I can."}, {"ja": "授業では、アウトプットの場面やグループ学習、意見交流、協働的に解決する場面が増えていると思います。", "en": "I think there are more moments of output, group learning, exchanging opinions and solving problems together in lessons."}, {"ja": "毎日ではないが、年度初めの教職員と5,6年生徒の熟議が今年度で3回目となった。また、学校生活については今年度初めて1～4年生も声を上げられる仕組みづくりを進めている。", "en": "Not every day, but the deliberation between staff and fifth- and sixth-graders at the start of the school year is now in its third year. This year we are also, for the first time, building a system so that grades 1–4 can speak up about school life."}, {"ja": "児童に寄り添い、できた！分かった！楽しい！など味わえるように。また、自分の思いを伝えたり、自己決定をしたりできるようにしている。クラブや委員会では、みんながいきいきできるためにどんなことができるかを考え、どんなクラブや委員会が必要か、児童が自分たちで考えている。高学年の総合的な学習の時間34カンパニーの進化版！", "en": "I stay close to the children so they can experience “I did it! I understand! This is fun!” I also help them express their thoughts and make their own decisions. In clubs and committees, the children themselves think about what they can do so that everyone can thrive, and what clubs and committees are needed. An evolved version of the upper-grade integrated studies “34 Company”!"}], "note": ""}, {"no": 2, "title": "Concrete approaches to multifaceted assessment (related to Q5)", "items": [{"ja": "テストの振り返りや授業の振り返りで自分自身の成長を見直すことができるように心がけている。", "en": "Through reflections on tests and lessons, I try to help them look back on their own growth."}, {"ja": "日々の授業のふりかえりシートやパフォーマンス課題の取り組む姿勢・スピーチ・作文など", "en": "Daily lesson reflection sheets, attitude to performance tasks, speeches, essays, etc."}, {"ja": "児童に意見を求める場面やもらった意見は必要であれば教師間で共有し、どうするかを考えている。委員会やクラブなど特別活動の多くの場面で児童の意見をもとに行っている。ノートや宿題、自主学習、授業での様子などの学力が定着するための努力とその成果を踏まえ評価している。", "en": "When I ask children for opinions, I share them among teachers when necessary and think about what to do. Many special activities such as committees and clubs are based on children’s opinions. I assess based on notebooks, homework, self-study and how they are in lessons, taking into account their efforts to consolidate learning and the results."}, {"ja": "自主学習や、授業中のノートでの記載内容を見たり、発言内容をチェックしている。", "en": "I look at what they write in self-study and lesson notebooks and check what they say in class."}, {"ja": "対話を通して学んだことを発表する場を設けたり、ロイロノートを使って考えたことや学んだこと、振り返りを書くなどし、それらを評価に取り入れている。", "en": "I create opportunities to present what they learned through dialogue, and have them write their thoughts, learning and reflections using Loilonote (a digital learning tool), and include these in assessment."}, {"ja": "児童主体の委員会活動", "en": "Student-led committee activities."}, {"ja": "教師と児童がともに学校を良くするために話し合う熟議を行っています。高学年以外の意見を吸い上げる機会も今年度模索中です。", "en": "We hold deliberations where teachers and children discuss together how to make the school better. This year we are also exploring ways to hear the views of children other than the upper grades."}, {"ja": "小テスト、単元テスト、パフォーマンステストに取り組む教科が増えている。", "en": "More subjects are using quizzes, unit tests and performance tests."}, {"ja": "年間２回、学習・生活面でアンケート調査を行っている。", "en": "We run a questionnaire on learning and daily life twice a year."}, {"ja": "ぐんぐんタイム", "en": "“Gungun Time” (a study-time programme)."}], "note": ""}, {"no": 3, "title": "Ways of raising interest and participation in school, and outreach (related to Q7)", "items": [{"ja": "あいさつ運動や花植え、広報など", "en": "Greeting campaigns, flower planting, public relations, etc."}, {"ja": "ホームページを充実している", "en": "We have enriched the website."}, {"ja": "文化祭の午後の活動など", "en": "Afternoon activities at the school festival, etc."}, {"ja": "学級通信や、学校ホームページで発信しているつもりである。", "en": "I believe we communicate through class newsletters and the school website."}, {"ja": "学校ホームページの作成や親子活動、文化祭午後の部など", "en": "Creating the school website, parent–child activities, the afternoon part of the school festival, etc."}, {"ja": "ふるさと学習や職場体験、文化祭（午後の部）など", "en": "Hometown learning, work experience, the school festival (afternoon part), etc."}, {"ja": "学校行事への案内 HPの毎日更新 学校だよりの全戸配布", "en": "Invitations to school events, daily website updates, school newsletter distributed to every household."}, {"ja": "学校だより、ホームページ、熟議、参観など", "en": "School newsletter, website, deliberations, open classes, etc."}, {"ja": "学校運営協議会を通しての連携は他校に比べると進んでいると思います。ただ美山の学校運営協議会のスペックを最大限に生かせているかというとそうではなく、学校としての工夫の余地はあると思っています。", "en": "I think our partnership through the school management council is more advanced than at other schools. But I don’t think we are making full use of what Miyama’s council can do, and I think there is room for the school to do more."}, {"ja": "学校運営協議会制度、美山まちづくり委員会との連携、学校だより・webサイトによる情報発信、放課後子ども教室（仮称）による参画。", "en": "The school management council system, partnership with the Miyama Town Development Committee, outreach through the school newsletter and website, participation through an after-school children’s class (provisional name)."}, {"ja": "・放課後子ども教室\n・総合的な学習の時間、生活科などいろいろな授業で地域の方から教えていただき交流\n・ホームステイ\n・こだま２組 和太鼓練習開始！", "en": "• After-school children’s class\n• Learning from and interacting with local people in integrated studies, life studies and many other lessons\n• Homestays\n• Kodama Class 2 has started taiko drumming practice!"}], "note": ""}, {"no": 4, "title": "Examples of student participation in local problem-solving or volunteering (related to Q10)", "items": [{"ja": "生徒自身がボランティアに参加できる仕組みがあるといいと思う", "en": "I think it would be good to have a system that lets students take part in volunteering themselves."}, {"ja": "総合的な学習の時間（美山学）", "en": "Integrated studies (Miyama Studies)."}, {"ja": "中学校では、教育課程の遂行や部活動の関係で、どうしても時間的制約があり、実際は日曜日以外の活動には、生徒たちも参加しにくい状況にあると思っています。", "en": "In junior high, because of the curriculum and club activities, time is inevitably limited, and in practice I think it is hard for students to take part in activities on any day other than Sunday."}, {"ja": "３年前から、5,6年生が「総合的な学習の時間」において、10年後の美山に残したい物・事というテーマで、興味ある分野について探究活動を行っている。", "en": "For three years, fifth- and sixth-graders have been doing inquiry projects in integrated studies on the theme of “things and practices we want to keep in Miyama ten years from now,” in fields that interest them."}], "note": ""}, {"no": 5, "title": "Comments from those who chose “Other” for “initiatives they focus on” (Q14)", "items": [{"ja": "今年5月29日に開催した「まちごとSchoolMeeting」（まちづくり委員会・美山小中学校学校運営協議会共催）の取組で、多くの地域住民・保護者が参加し、現在に至る美山の地域と協働した教育について理解を得る大きな一歩となったこと。", "en": "The “Machigoto School Meeting” held on 29 May this year (co-hosted by the Town Development Committee and the Miyama Elementary and Junior High School Management Council), in which many residents and parents took part, was a big step towards understanding Miyama’s education in collaboration with the community up to now."}], "note": ""}, {"no": 6, "title": "Comments from those who chose “Other” for “the biggest barrier” (Q15)", "items": [{"ja": "僻地であるがゆえの不自由さが多い。（公共交通機関の少なさ・生徒数の減少による偏った人間関係など）", "en": "There are many inconveniences because it is a remote area (little public transport, skewed relationships due to falling student numbers, etc.)."}, {"ja": "社会の大きな変化に学校現場（保護者・地域・学校教職員）の理解やスキル、マインドチェンジがついていけていない。", "en": "The understanding, skills and mindset of schools (parents, community and school staff) have not kept up with major changes in society."}], "note": ""}, {"no": 7, "title": "Their most important educational goal and what they want to teach students (Q16)", "items": [{"ja": "教育の目標は、その生徒が生きやすい道を選べるように支援することです。今何を考えているか、どんな思いを抱えているかを聞いて受けとめ、一緒に考えることが大切だと実感しています。", "en": "My educational goal is to support each student in choosing a path that is easier for them to live. I have come to feel how important it is to listen to and accept what they are thinking now and what they are carrying, and to think together."}, {"ja": "生きる力を身につけていきたい。中学校を卒業すると社会へと出ていく。だからこそ、大人にならないといけないし、美山という場所から広い世界へと旅だっていくこと。", "en": "I want them to gain the ability to live. After junior high they go out into society. That is why they have to grow up, and set off from Miyama into the wider world."}, {"ja": "生徒が幸せになることを１番に望んでいます。そのため基礎的な知識ももちろん大事ですが、日々の学校生活での人とのかかわり方や、コミュニケーション力、疑う力等を教えたいと思う。", "en": "Above all I want students to be happy. Basic knowledge is of course important, but I want to teach them how to relate to people in daily school life, communication skills, the ability to question, and so on."}, {"ja": "よく生きること、自分に正直に生きてほしい。", "en": "I want them to live well, and to live honestly with themselves."}, {"ja": "目標としては、どんな時代どんな社会でも生きていける人材の育成。そのために、「自分のことは自分でやる」「困った時は助けてと言える」「ありがとう、ごめんを素直に言える」「縦横どの関係でも他者と繋がる」「最低限の一般常識」は身につけさせたい。", "en": "My goal is to raise people who can live in any era and any society. To that end, I want them to learn to “do what you can for yourself,” “ask for help when you’re in trouble,” “say thank you and sorry honestly,” “connect with others in any relationship, across ages and among peers,” and “basic common sense.”"}, {"ja": "子どもが安心して学校で過ごし、いずれ社会で生きていく中での自分の在り方みたいなものを見つけて、幸せに生きていくこと。そのために、できないことを受け入れながらも頑張ることの大切さであったり、人との繋がりの尊さであったり、自分が好きなこと、がんばっていることなど自分のがんばりを自分で認める力などを自分の経験も交えて伝えられたらいいなと思う。", "en": "For children to spend time at school feeling safe, to find their own way of being as they go on to live in society, and to live happily. To that end, I hope to share, drawing on my own experience, things like the importance of trying hard while accepting what you can’t do, the value of connections with people, and the ability to recognise your own efforts in what you love and work at."}, {"ja": "大人になっても学び続け、人生を楽しめること。そのためにも、学ぶことの楽しさが伝えたい", "en": "To keep learning and enjoying life even as adults. For that, I want to convey the joy of learning."}, {"ja": "いろいろな経験体験を通して学ぶこと他者と協働する力や発信する力をつけていきたい", "en": "I want them to learn through many experiences and to gain the ability to work with others and to express themselves."}, {"ja": "予測可能な社会を生き抜く力をつけさせたい。学生に教えたいことは「視野を広げること」", "en": "I want them to gain the ability to live through a [un]predictable society. What I want to teach students is “to broaden their horizons.”"}, {"ja": "自分を大切に、周りの人を幸せにできる人になること", "en": "To value themselves and become people who can make those around them happy."}, {"ja": "1番の目標は関わった子どもたちがもれなく自分の幸せな人生を生きることです。そのためには自己理解と自分の活かし方を知ることが大切だと思います。", "en": "My number one goal is that every child I teach lives their own happy life. For that, I think it is important to understand themselves and know how to make the most of themselves."}, {"ja": "大人になった時に社会を力強く生きる力をつけるため、基盤となる基礎基本をしっかりと身につけてほしいと思っています。＊学力（知識・技能を含む）、常識、道徳心、礼儀や作法の全般で。", "en": "To gain the strength to live powerfully in society as adults, I want them to master the fundamentals that form the base. * In academic ability (including knowledge and skills), common sense, morals, courtesy and manners overall."}, {"ja": "自分たち大人を超える子どもを育てること。現状を自分でより良くしていくというマインドをもつこと。", "en": "To raise children who surpass us adults. To have the mindset of improving the current situation themselves."}, {"ja": "自立できる力をつける。自分のことをよく知り、助けあおう。", "en": "To gain the ability to be independent. Know yourself well, and help each other."}, {"ja": "子どもたちの笑顔が輝くようにする信頼できる大人はそばにいるよ", "en": "Making children’s smiles shine. A trustworthy adult is right beside you."}], "note": ""}, {"no": 8, "title": "Concrete episodes, future outlook and opinions (Q17)", "items": [{"ja": "なかなか日々時間に追われて目の前のことでいっぱいで、何かを考える余裕がありません。", "en": "I’m so busy every day with what’s in front of me that I have no room to think about anything."}, {"ja": "相手の人の想いを想像して行動できる人になってほしい。自分だけ良ければいいじゃなく、周りの人に力を使える生きる力をつけてほしい", "en": "I want them to become people who imagine others’ feelings and act on them. Not “as long as I’m fine,” but I want them to gain the strength to use their abilities for the people around them."}, {"ja": "自然あふれる美山の景色に囲まれて、のびのびと勉強できることに誇りをもってほしい。美山はその名の通り、美しいです。ありがとうございました。", "en": "I want them to be proud that they can study freely surrounded by Miyama’s nature-filled scenery. Miyama is beautiful, just as its name (“beautiful mountains”) says. Thank you."}, {"ja": "デンマークで深い学びができることを願っています。また、その学びを小学生や中学生に伝える機会を作っていただけるとありがたいです。", "en": "I hope you gain deep learning in Denmark. I would also be grateful if you could create opportunities to share that learning with elementary and junior high students."}, {"ja": "自分で考えること、主体的に行動する姿勢はもちろん大切ですが、その基となる判断や認識が間違っていると正しい行動がとれないので、そこは大人がしっかり教え、伝えることが大切だと思っています。そういう意味では、もう少し子どもたちへの厳しさが必要な部分もあるのかなと思っています。", "en": "Thinking for yourself and acting independently are of course important, but if the judgement and understanding behind them are wrong, you cannot act rightly, so I think it is important for adults to teach and convey that properly. In that sense, I think in some areas a bit more strictness towards children may be needed."}, {"ja": "美山の教育は、少しずつではあるが、間違いなく良い方向に向かってきていると感じています。しかし、まだまだそのより良い方向に向かうサイクルが定着しているわけではありません。その定着を目指して、（こうやってアンケートを取ってくれている若者たちを含め）多様な年代・性別・立場の意識共有・協働が必要だと感じています。", "en": "I feel that education in Miyama is, little by little, definitely moving in a good direction. But the cycle of moving in that better direction is not yet established. To establish it, I feel shared awareness and collaboration across ages, genders and positions (including young people like you who are running this survey) are needed."}, {"ja": "・子どもたちと一緒に笑いあえるのは楽しい\n・こだま２組の和太鼓 学習発表会のオープニングを飾りたい！(こういう今後の展望じゃない？笑)", "en": "• It’s fun to be able to laugh together with the children\n• I want Kodama Class 2’s taiko to open the learning presentation day! (Not the kind of outlook you meant? lol)"}], "note": ""}]}, {"id": "B-4", "region": "dk", "role": "teacher", "n": 23, "title": "B-4", "sections": [{"no": 1, "title": "What they keep in mind about student participation and dialogue, with examples (related to Q3)", "items": [{"en": "Group work, projects, PBL", "ja": "グループワーク、プロジェクト、PBL（課題解決型学習）。"}, {"en": "Group work, talk two and two, talks with students one on one, presentations", "ja": "グループワーク、ペアでの話し合い、生徒との一対一の対話、プレゼンテーション。"}, {"en": "Co-teaching is key to reach all students", "ja": "すべての生徒に届くためには、コ・ティーチング（複数教員による協働指導）が鍵である。"}], "note": ""}, {"no": 2, "title": "Concrete approaches to multifaceted assessment (related to Q5)", "items": [{"en": "Formative assessment.", "ja": "形成的評価。"}, {"en": "Presentations, talks, talks in plenum, written asignments, minor tests", "ja": "プレゼンテーション、対話、全体での話し合い、記述課題、小テスト。"}, {"en": "We use continuous assessment for our students", "ja": "生徒に対して継続的な評価を行っている。"}], "note": "* There were no answers in the free-text fields related to Q7 (outreach to the community) and Q10 (examples of local projects)."}, {"no": 3, "title": "Comments from those who chose “Other” for “the biggest barrier” (Q15)", "items": [{"en": "I think the government should focus more on the educational system, economy etc.", "ja": "政府は教育制度や経済などにもっと力を注ぐべきだと思う。"}], "note": ""}, {"no": 4, "title": "Their most important educational goal and what they want to teach students (Q16)", "items": [{"en": "For me it's important for student to learn how to learn", "ja": "私にとって大切なのは、生徒が「学び方を学ぶ」こと。"}, {"en": "History", "ja": "歴史。"}, {"en": "To become good people who take care of each other", "ja": "互いを思いやれる良い人間になること。"}, {"en": "reading", "ja": "読むこと。"}, {"en": "To prepare the students for life in Denmark.", "ja": "生徒がデンマークでの生活に備えられるようにすること。"}, {"en": "Teaching students to coexist with their fellow students in combination with expanding their knowledge on various subjects", "ja": "さまざまな教科の知識を広げながら、仲間の生徒と共に生きることを教えること。"}, {"en": "Subject based objectives and Bildung", "ja": "教科ごとの目標と、ビルドゥング（Bildung：人間形成・全人教育）。"}, {"en": "i want them to learn math", "ja": "数学を学んでほしい。"}, {"en": "I want to teach them danish and how to use the danish language correctly", "ja": "デンマーク語と、その正しい使い方を教えたい。"}, {"en": "klassefællesskab", "ja": "クラスフェレススカブ（klassefællesskab：学級共同体）。"}, {"en": "My primary educational objective is to help students become curious, confident and independent learners. I want to create a safe classroom where they feel comfortable asking questions, sharing ideas and learning from their mistakes. I would like my students to leave my lessons not only with new knowledge, but also with the confidence to think for themselves.", "ja": "私の第一の目標は、生徒が好奇心と自信をもった自立した学習者になるよう支援すること。生徒が安心して質問し、考えを共有し、間違いから学べる安全な教室をつくりたい。授業を終えた生徒が、新しい知識だけでなく、自分の頭で考える自信も身につけていてほしい。"}, {"en": "I don't know", "ja": "わからない。"}, {"en": "Learn how to learn - and how to be one self", "ja": "学び方を学ぶこと。そして、自分自身であること。"}, {"en": "Getting students aged 6-8 to learn the basic in reading/writing that lets them go on in the next years tol use those skills in other scenarios. All that while being included in the social life amongst other students", "ja": "6〜8歳の生徒が読み書きの基礎を身につけ、その後の学年でほかの場面にも生かせるようにすること。それを、ほかの生徒との社会生活に包摂されながら実現すること。"}, {"en": "Our primary objective is to help students develop confidence, practical skills and a sense of responsibility. Through Juniormesterlære, we want to teach them how to connect school learning with real-life work, discover their strengths and prepare for their future education and careers.", "ja": "私たちの第一の目標は、生徒が自信、実践的なスキル、責任感を育むよう支援すること。ジュニアマイスター制度（Juniormesterlære）を通じて、学校での学びを実社会の仕事と結びつけ、自分の強みを見つけ、将来の進学やキャリアに備える方法を教えたい。"}, {"en": "Motivated children being interested in the world around them", "ja": "身の回りの世界に興味をもつ、意欲的な子どもたち。"}, {"en": "How to be in a the given enviroment and participate in the school activities. How to enjoy school basically", "ja": "与えられた環境の中でどう過ごし、学校の活動に参加するか。要するに、学校を楽しむ方法。"}, {"en": "To function as an individual in a community with respect for nature. Awareness of consuming culture. To be social intelligent. I try to include aspects and awareness of these things in my teaching.", "ja": "自然を尊重しながら、共同体の中で一人の個人として生きること。消費文化への意識。社会的知性をもつこと。こうした観点や意識を授業に取り入れるようにしている。"}, {"en": "I want the students to like to go to school and understand that it is good to educate oneself.", "ja": "生徒が学校に行くのを好きになり、自らを教育することは良いことだと理解してほしい。"}], "note": "* 4 answers consisting only of symbols such as “???”, “?” or “..” are omitted."}, {"no": 5, "title": "Concrete episodes, future outlook and opinions (Q17)", "items": [{"en": "her er rart", "ja": "ここは居心地がよい。（デンマーク語）"}, {"en": "From my perspective we have a greater responsebility than just teaching mat and Danish. We need to support considerative young people to be aware of own actions and how to be a good human beings in a capitalistic consuming world.", "ja": "私の考えでは、私たちには数学やデンマーク語を教える以上の大きな責任がある。消費社会・資本主義の世界の中で、自分の行動を自覚し、良い人間であろうとする思いやりのある若者を支えていく必要がある。"}], "note": "* 2 answers consisting only of symbols are omitted."}]}], "interview": [{"who": "teacher", "title": "Interview with teachers", "topics": [{"no": 1, "title": "Multifaceted Evaluation and Inquiry-Based Learning", "qs": [{"q_en": "How do you implement the evaluation process beyond paper tests, and how do teachers share and operate evaluation criteria among themselves?", "a_en": "In Denmark, there are only official exams for 8th grade and 9th grade, which also depend on each teacher’s choice to take. There are several ways to evaluate their work, including small assignments, presentations, and discussion during the class. Teachers will set the goal for the class to meet the result that is assigned by the government education center, but the evaluation criteria depend on the individuals. The goal is the same, but how they evaluate and make students work is different.", "q_ja": "筆記試験以外の評価はどのように実施されているか。また、教師は評価基準をどのように共有し、運用しているのか。", "a_ja": "デンマークでは、法律により試験は8年生と9年生のみと定められ、実施するかどうかも各教員の判断に委ねられています。義務教育の最終学年（９年生）には卒業試験が行われますが、基本的に７年生までは通知表も存在しません。通常は、小レポート、プレゼンテーション、授業内でのディスカッションなど、さまざまな方法で生徒の学びを評価します。政府の教育省が設定した目標に対してクラス全体で到達できるよう教員がゴールを設定しますが、具体的な評価基準や生徒へのアプローチ方法は教員個人の判断に任されています。北の星国民学校では、それぞれの教科担当の教師で共通の課題を設定し、それに対する評価方法は教師個人が定めます。"}]}, {"no": 2, "title": "Creating Time and Curriculum Flexibility", "qs": [{"q_en": "How many hours do teachers work in a day at school? How do Danish schools reduce the burden of lesson preparation and administrative work?", "a_en": "The working hours of teachers, by law, are 40 hours per week, which is 45 min, 26 lessons in the maximum. However, there is flexibility about how many lessons they have by position and the other tasks that they have. The head teachers for the subject have fewer classes because they need other work, and teachers who are responsible for attending the school trip have fewer classes too. They will reduce the burden of preparation time by doing so, while all the teachers have the same time for class preparation time.", "q_ja": "教員は学校で1日に何時間働いているか。デンマークの学校では授業準備や行政業務の負担をどのように軽減しているか。", "a_ja": "法律上の労働時間は週40時間で、授業（1コマ45分）は最大週26コマです。（教科担当制）ただし、役職や担当業務によってコマ数には柔軟性があります。たとえば、教科主任は他の校務があるため持ちコマ数が少なく設定されており、校外学習を担当する教員なども同様に授業負担が軽減されます。全教員に共通の授業準備時間を確保しつつ、役割に応じた調整を行うことで負担軽減を図っています。 ただし、教科によって必要な準備時間が異なるため、より長く準備時間が必要な教科が存在するなど、それによる弊害も発生しています。"}]}, {"no": 3, "title": "Approaches for Students from Multicultural Backgrounds", "qs": [{"q_en": "What academic and emotional support is provided school-wide for students from different language and cultural backgrounds?", "a_en": "The educational council has some classes where international students can learn about Denmark in general as well as the Danish language. As a common system, there is no specific system all Danish schools adopt, but in Norsherskolen, there is a system where small kids can take more Danish classes that the teacher is specializing to teach Danish as a second language. For older students, there is no system to support those students and because of the Ukraine war, there are some students who does speak zero Danish and struggle to fit in the class, and each teacher’s commitment is required in that case.", "q_ja": "異なる言語や文化背景を持つ生徒に対して、学校全体でどのような学習面・精神的サポートが提供されているか。", "a_ja": "教育委員会主導で、留学生などがデンマーク全般やデンマーク語を学ぶ講座が開設されています。国レベルで共通する統一制度はありませんが、北の星国民学校（Nordstjerneskolen）では、低学年（〜6年生）向けに「第二言語としてのデンマーク語」の専門教員による授業を受ける仕組みがあります。一方で高学年向けの支援体制は不足しており、ウクライナ情勢による避難民などデンマーク語が全く話せない生徒の適応については、現場の各教員個人の配慮に依存しているのが現状です。"}, {"q_en": "How do you support students with emotionally-based school avoidance/refusal?", "a_en": "There is no specific policy or system to support as a school. Each teacher meet the parent and make individual agreements to how they can come to school, such as coming for just specific subject/teacher, however, the problem is increasing in recent years. In Denmark, if students choose not to come, there are always alternative way to learn or achieve what they want,(homeschool or other thing) therefore, it was not such a big issue until recent years the number of those students are increasing.", "q_ja": "心理的・感情的な理由による不登校（登校拒否）の生徒をどのように支援しているか。", "a_ja": "学校としての統一された方針やシステムはありません。教員が保護者と面談し、「好きな教科や特定の授業だけ出席する」といった個別の合意を交わして対応しています。デンマークでは不登校になってもホームスクーリングなどの多くの代替手段が常に存在するため、かつては大きな問題とされていませんでしたが、近年不登校の生徒数が増加しており課題となっています。"}]}, {"no": 4, "title": "Decision making", "qs": [{"q_en": "How are parents' and community opinions reflected in school management?", "a_en": "School board members are always half parents and the chairman is one of the parent. Locals who does not have children in the school have no opportunity to participate in school management. Instead, they do open school one in a whole to welcome locals and hear anything from them.", "q_ja": "保護者や地域住民の意見は、学校運営にどのように反映されているか。", "a_ja": "学校運営協議会（School Board）の構成員の半数は保護者であり、議長も保護者が務めています。子どもが通っていない地域住民が直接運営に参加する機会はありませんが、年に1度「オープン・スクール」を開催し、地域住民を歓迎して広く意見を聞く場を設けています。"}]}, {"no": 5, "title": "Educational Philosophy", "qs": [{"q_en": "How does the Danish educational system support teachers to adapt to emerging ideas and new policies?", "a_en": "When the new policy is from the educational administration, they make several courses for teachers to learn those new things and provide materials. Danish teachers prefer to take those courses to keep updated and there are plenty of resources for teachers to learn. If the policy was made by local government, they are mostly forced to adapt. If the idea is really new and need special knowledge to implement, they offer outside teachers to teach teachers and students instead.", "q_ja": "デンマークの教育システムは、新たな施策や教育理念に教員が適応できるようどのようにサポートしているか。", "a_ja": "教育委員会や、教育省からの新方針であれば教員向けの研修講座や教材が用意され、教員も主体的に学びをアップデートしています。地方自治体決定の政策は導入が義務付けられるケースが多いです。専門知識が必要な新しいテーマの場合は、外部講師を招いて教員や生徒に直接指導を行わせます。"}]}, {"no": 6, "title": "Lessons from Japanese Education Settings", "qs": [{"q_en": "What is the single most important “core skill” Danish education aims to impart?", "a_en": "Government policy is to improve STE(A)M subject and readings and math for national test. As a school, they try to focus on IT skills especially how to use practically, efficiently and ethically. To cooperate with others and learn how to learn.", "q_ja": "デンマーク教育が授けようとしている最も重要な「核となるスキル」は何か。", "a_ja": "政府の方針としては、全国テストに向けた読解力・数学力やSTE(A)M分野の強化です。学校現場では特にITスキルの実践的・効率的・倫理的な活用法や、「他者との協働」、そして「学び方を学ぶ力」の育成に重点を置いています。"}, {"q_en": "What are the difficulties or challenges faced in Danish schools?", "a_en": "There are families with economic difficulties and they tend to have less attention to school and receive less cooperation from those parents. If their child is not doing good at school, they tend to think that it is totally school’s fault and there are not much support from parents to their children. Students are more becoming more individualistic in recent years, and teachers cannot force them to do anything much, that if students do not want to do anything, they cannot do anything about much because if they force to do so, it can be illegal. To avoid the difference ability and level of academic skills, two-teachers classroom is implemented. Two teachers in one class to manage the different levels, need additional cooperation between teachers that have different methods of teaching.", "q_ja": "デンマークの学校が直面している課題や困難は何か。", "a_ja": "経済的な問題を抱える家庭では学校教育への関心が薄く、保護者の協力が得られにくい傾向があります。そういった家庭では、子どもが学校生活や学習で上手くいかない場合、すべてが学校の責任と考えていることが多く、子どもへの保護者からの支援が十分に受けられません。また、近年は生徒の個人主義化が進み、嫌がることを無理に強制すると違法となり得るため、教員からの指導方法が難しくなっています。習熟度や能力の差に対応するため「1学級2人担任制」を取り入れていますが、指導方針の異なる教員同士の調整が必要になるという課題もあります。"}, {"q_en": "Things from Japanese school education such as detailed student guidance, collective activities like cleaning and school meals, and a culture of collectivism- are there aspects you feel could be incorporated into Danish education?", "a_en": "There are so much to learn from Japanese school especially leaning cooperation with others, however, as a school system, school lunch cannot be implemented because of the cost, and the cleaning is banned because of the danger of its tool. Students cannot manage their behavior with how to use those tools as a cleaning tool and it is a problem that their behavior is not mature enough as they age.", "q_ja": "日本の「きめ細やかな生徒指導」「清掃や給食などの集団行動」「集団主義」の中で、デンマーク教育に取り入れられると感じる点はあるか。", "a_ja": "他者との協働を学ぶ点など、日本から学べる部分は多いですが、給食はコスト面から導入が難しく、清掃活動は道具の安全管理上の懸念（生徒が掃除道具を正しく扱えずトラブルになるリスク）から禁止されています。"}, {"q_en": "What do you think are the strengths of individual-focused education vs. Japanese collectivist education, and how can both countries learn from each other?", "a_en": "Individualism: their education create individual personality traits, creativity, and critical thinking, however, this also creates isolation and individualistic behavior in school which is a issue as a social group. Collectivism: The group focused eduction creates less critical thinking because they prefer to be as a group and avoid/lack of being as themselves. However, Japanese education teach students to be part of the society and being as a social group which is important when they become an adult.", "q_ja": "個尊重型教育と日本型集団主義教育のそれぞれの強み、および相互に学べる点は何か。", "a_ja": "どちらのモデルにも一長一短が存在すると考えますが、デンマークの教育制度は、個人の特質、創造性、そして批判的思考力を養うことができる点が強みです。しかしその反面、学校という社会的グループの中で「孤立」を生み出したり、個人主義的な行動が目立つようになったりすることが課題となります。一方で、 集団を重視する教育では、人々がグループでいることを好み、自分らしくいることを避けたり欠いたりする傾向があるため、批判的思考力（自主的に疑問を持つ力）が育ちにくくなります。しかし、日本の教育は「社会の一員となること」や「社会集団として機能すること」を教えており、これは子どもたちが大人になったときに非常に重要なスキルとなります。"}]}]}, {"who": "student", "title": "Interview with students", "topics": [{"no": 1, "title": "Voice and Decision-Making", "qs": [{"q_en": "Do you feel that your opinions and ideas are listened to and reflected in school rules, events, or daily classroom activities? Can you share a specific example?", "a_en": "It depends on the teachers but mostly, their opinions are well reflected. When students speak up to what they want, most of the time they try to manage.", "q_ja": "校則や行事、日々の授業において、自分の意見やアイデアを聞いてもらえたり、反映されていると感じますか？具体的な例があれば教えてください。", "a_ja": "教員によって異なりますが、ほとんどの場合は意見がしっかりと反映されています。生徒がやりたいことを声に出して伝えると、教員は大抵の場合なんとか実現できるよう対応しようとしてくれます。"}]}, {"no": 2, "title": "Handling Different Opinions", "qs": [{"q_en": "When you have a different opinion from your classmates during group work or discussions, how do you usually resolve it?", "a_en": "Usually, they work out themselves and teachers have no commission to resolve. If they want to change the group, teachers would change.", "q_ja": "グループワークやディスカッションの際、クラスメイトと意見が異なった場合はどのように解決していますか？", "a_ja": "通常は生徒同士で解決し、教員が介入して解決することはありません。もしグループを変えたいと希望があれば、教員がメンバーの変更を行います。"}, {"q_en": "How do you balance expressing your own ideas with getting along with others?", "a_en": "If they do want to get along, they don’t. They express themselves with their cloth, dyeing their hair", "q_ja": "「自分の考えを表現すること」と「他者とうまくやっていくこと」をどのように両立させていますか？", "a_ja": "デンマークでは生徒同士が合わないと感じれば、仲良くすることがほとんどありません。一方で、服装、髪を染めることなどで、自分自身を自由に表現しています。"}]}, {"no": 3, "title": "Learning Environment & Wellbeing", "qs": [{"q_en": "When do you feel most engaged or comfortable being yourself at school? What kind of encouragement or feedback from teachers helps you feel that way?", "a_en": "When they are in class with favorite teachers or the class they like they are comfortable with benign themselves. Some students prefer to be in a small group to express their opinions.", "q_ja": "学校で「最も意欲的になれる」「自分らしくいられる」と感じるのはどんなときですか？ また、教員からのどのような声かけやフィードバックがそのように感じる助けになっていますか？", "a_ja": "好きな教員が指導する授業や、好きな教科の授業を受けているときに、自分らしく安心して過ごすことができます。また、生徒によっては自分の意見を自由に表現するため、少人数グループで取り組むことを好む場合もあります。"}]}, {"no": 4, "title": "Making School Better", "qs": [{"q_en": "What changes would you like to see implemented to make school more fun and more beneficial for you?", "a_en": "From 7th grade, their work is more group project and they do not have much time to work alone. One participants preferred to work alone more. Their class is about 90 mim and they want a small breaks during classes so that they can stay focused in the class. They want some class activities to get along with classmates because in the current situation, they feel that they are separated.", "q_ja": "学校がより楽しく、自分にとってためになる場所になるよう、どのような変更や工夫が実現してほしいですか？", "a_ja": "7年生（中学生年代）以降はグループでのプロジェクト作業が増え、個人で静かに作業する時間が減ってしまいます。生徒の中には「もっと一人で作業できる時間がほしい」と希望する声がありました。また、同じ授業が２コマ続きで、約90分間と長いため、集中力を維持できるよう授業内に短い休憩時間を挟んでほしいという要望もあります。さらに、現状では「生徒同士が分断されている（バラバラになっている）」と感じる場面があるため、クラスメイトと打ち解け合えるようなクラス全体の親睦活動を求めています。"}]}]}], "chapters": [{"id": "abstract", "no": "Abstract", "title": "Abstract", "lead": "Purpose, key findings and implications for practice", "secs": [{"h": null, "p": ["This study compares the educational environments of Japan (Miyama Town) and Denmark (Gribskov Municipality) in response to two shared challenges, teachers’ growing workload and the well-being of students, with the aim of drawing lessons for building sustainable schools. We used a mixed-methods design combining questionnaires for teachers and parents in both areas with interviews of teachers and students at a local Danish school. In both countries roughly eight in ten teachers reported feeling overloaded, yet clear structural differences appeared in the sense of having room for new initiatives (Japan 0.0%, Denmark 30.4%) and in the educational values parents prioritise (Japan: self-esteem; Denmark: academic ability). In Miyama, parents’ “considerate reticence” and the gap between elementary and junior high school also emerged as issues. The study indicates that it is essential to shift to team-based teaching that does not depend on individual teachers’ passion, and to build the openness that lets schools, families and the community support one another as joint partners."]}]}, {"id": "ch1", "no": "Chapter 1", "title": "Introduction", "lead": "Asking the question, and looking at local education from many sides.", "secs": [{"h": "1.1 Purpose of the study", "p": ["In a rapidly changing society, creating learning environments where children can grow up healthy and self-directed is a shared challenge across countries and regions. This report brings together a study that compares, both quantitatively and qualitatively, the pioneering efforts of a rural Japanese municipality
