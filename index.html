  let k=0;
  const body=c.secs.map((s,si)=>{
    const sid=`${c.id}-s${si}`;
    const h=s.h?(s.sub?`<h3 id="${sid}">${esc(s.h)}</h3>`:`<h2 id="${sid}">${esc(s.h)}</h2>`):'';
    const ps=(s.p||[]).map(p=>`<p>${linkify(esc(p))}</p>`).join('');
    if(s.note) return h+`<div class="box">${ps}</div>`;
    return h+(s.block?blockHTML(s.block):'')+ps;
  }).join('');
  const prev=CH[ci-1], next=CH[ci+1];
  return crumbs([{t:'概要',h:'top'},{t:'本編',h:'report'},{t:c.id==='abstract'?'概要':c.no}]) + `<div class="wrap reader">${toc}
   <article class="doc"><header class="chhead"><span class="no">${c.id==='abstract'?'REPORT':esc(c.no)}　<span class="layer-tag">LAYER 3</span></span><h1>${esc(c.title)}</h1><span class="lead">${esc(c.lead)}</span></header>
   ${body}
   ${D.chapterFix[c.id]?`<p class="fixnote" style="text-indent:0">${esc(D.chapterFix[c.id])}</p>`:''}
   <nav class="chnav">${prev?`<a href="#${prev.id}"><small>前へ</small>${esc(prev.id==='abstract'?'概要':prev.no+'　'+prev.title)}</a>`:'<span></span>'}${next?`<a href="#${next.id}"><small>次へ</small>${esc(next.no+'　'+next.title)}</a>`:`<a href="#data"><small>次へ</small>付録A　集計データ</a>`}</nav>
   </article></div>`;
}
function linkify(s){
  return s.replace(/付録C(：|:)インタビュー全文より質問([0-9０-９１-９]+)/g,(m)=>`${m} <a class="xref" href="#interview">付録Cへ</a>`)
          .replace(/巻末の「付録C：インタビュー全文」/g,m=>`${m} <a class="xref" href="#interview">付録Cへ</a>`);
}

function renderVoices(){
  const out=$('#vout'); if(!out) return;
  const q=vf.q.trim().toLowerCase();
  const hl=s=>{s=esc(s);if(!q)return s;const e=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(e,'gi'),m=>`<mark>${m}</mark>`)};
  let total=0;
  const html=D.voices.filter(g=>(vf.region==='all'||g.region===vf.region)&&(vf.role==='all'||g.role===vf.role)).map(g=>{
    const secs=g.sections.map((s,si)=>{
      const items=s.items.filter(it=>!q||((it.ja||'')+' '+(it.en||'')).toLowerCase().includes(q));
      if(!items.length && q) return '';
      total+=items.length;
      return `<div class="vsec" id="${g.id.toLowerCase().replace('-','')}-${s.no}"><h3>（${s.no}）${esc(s.title)}　<span class="count">${items.length}件</span></h3>
       <div class="vlist">${items.map(it=>`<div class="vitem ${g.region}">${it.en?`<span class="tr">仮訳</span>`:''}<span>${hl(it.ja)}</span>${it.en?`<span class="en" lang="en">${hl(it.en)}</span>`:''}</div>`).join('')}</div>
       ${s.note?`<p class="vnote">${esc(s.note)}</p>`:''}</div>`}).join('');
    if(!secs) return '';
    return `<section class="vgroup"><h2><span class="chip ${g.region}">${g.region==='mi'?'美山町':'デンマーク'}</span>${g.role==='parent'?'保護者':'先生'}（N=${g.n}）<span class="fine">付録${g.id}</span></h2>${secs}</section>`;
  }).join('');
  out.innerHTML=html||`<p class="empty">「${esc(vf.q)}」を含む回答は見つかりませんでした。別のことばで探すか、地域・立場の絞り込みを「すべて」に戻してください。</p>`;
  $('#vcount').textContent=`${total}件を表示`;
  document.querySelectorAll('.seg-ctl').forEach(c=>c.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(vf[c.dataset.k]===b.dataset.v))));
}

  const out=$('#iout'); if(!out) return; let n=0;

/* ---------- router ---------- */
const DEPTH={top:1};THEMES.forEach(t=>DEPTH[t.id]=2);
const NAVKEY=id=>id==='top'?'top':THEMES.some(t=>t.id===id)?'theme':(id==='report'||CH.some(c=>c.id===id)||id==='about')?'report':['voices','interview','data'].includes(id)?id:'';
function route(){
  let h=(location.hash||'#top').slice(1)||'top', anchor=null, arg=null;
  let m=h.match(/^((?:ch\d|abstract))-s(\d+)$/); if(m){anchor=h;h=m[1]}
  m=h.match(/^voices-(b\d)-(\d)$/); if(m){anchor=h.slice(7);h='voices'}
  m=h.match(/^data-(a\d+)$/); if(m){anchor=h;dset=['a1','a2','a3'].includes(m[1])?'parent':'teacher';h='data'}
  m=h.match(/^interview-([ts]\d)$/); if(m){anchor=h;h='interview'}
  if(h==='compare'){h='top';anchor='compare'}
  if(!ROUTES[h]){h='top'}
  const v=$('#view'); v.classList.remove('enter'); void v.offsetWidth;
  v.innerHTML=ROUTES[h](arg)+footer(); v.classList.add('enter');
  if(h==='voices'){renderVoices();bindVoices()} if(h==='interview'){renderInterview();bindInterview()} if(h==='data'){renderData();bindData()}
  const d=DEPTH[h]||3; const dp=$('.depth'); dp.dataset.d=d; $('#depthLabel').textContent=['','概要','テーマ','本編・資料'][d];
  document.querySelectorAll('.nav a').forEach(a=>a.setAttribute('aria-current',String(a.dataset.n===NAVKEY(h))));
  const t=anchor&&document.getElementById(anchor);
  if(t){requestAnimationFrame(()=>t.scrollIntoView({block:'start'}))} else window.scrollTo(0,0);
  document.title=(h==='top'?'':(titleOf(h)+'｜'))+'美山 × デンマーク 教育調査';
}
function titleOf(h){const t=THEMES.find(x=>x.id===h);if(t)return t.title;const c=CH.find(x=>x.id===h);if(c)return c.id==='abstract'?'本編 概要':c.no+' '+c.title;return {voices:'自由記述の全文',interview:'インタビュー全文',data:'集計データ',glossary:'用語解説',about:'はじめに'}[h]||''}
function bindVoices(){

  const q=$('#vq'); q.value=vf.q; q.addEventListener('input',()=>{vf.q=q.value;renderVoices()});
}
function bindInterview(){$('#ilang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ilang=b.dataset.v;renderInterview()})}
function bindData(){$('#dset').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;dset=b.dataset.v;renderData()})}
function footer(){return `<footer class="foot"><span class="c1" aria-hidden="true"></span><span class="c2" aria-hidden="true"></span><div class="wrap">

  <div><span class="rart" lang="da">Her er rart.</span> <span style="font-weight:700;font-size:14px">ここは居心地がいい。— デンマークの先生の回答より</span></div>
  <a class="cta" href="https://edu-project.jp/contact" target="_blank" rel="noopener">お問い合わせ（edu-project.jp/contact）</a>
  <div class="row"><div><strong style="font-weight:900;font-size:15px">NPO法人　森の教育プロジェクト</strong><br>調査・執筆　古北咲恵莉／加地優咲希<br>発行日　2026年10月20日</div>
  <div style="font-family:var(--f-num);font-weight:700;letter-spacing:.12em;text-align:right">2026 EDUCATION FIELD REPORT<br>MIYAMA × DANMARK</div></div>
  <p style="font-size:13px;line-height:1.8">調査にご協力いただいた美山町とグリブスコウ市の先生方・保護者の皆さま、北の星国民学校の先生と生徒の皆さんに、心より感謝申し上げます。</p>
 </div></footer>`}
